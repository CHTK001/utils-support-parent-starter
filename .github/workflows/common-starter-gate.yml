# utils-support-common-starter 门禁：过滤器链与 FTP/FTPS 服务器
#
# 覆盖范围（2026-10-01 起）：
#   - AbstractServerFilterSymmetryTest  addFilter/removeFilter 对称性（响应式过滤器）
#   - FtpServerPortBindingTest          FTP/FTPS 必须绑定调用方配置的端口
#   - ServiceDefinitionFailureDiagnosabilityTest  SPI 实例化失败必须可诊断
#   - 以及本模块其余测试
#
# 为什么必须单独建门禁（历史结论，勿删）：
#   本模块此前 src/test 下 4 个文件全是 main() 程序、零 @Test，surefire 实际跑 0 个测试，
#   而仓库根目录同时存在 engine-integration-tests.yml——那份门禁只覆盖引擎依赖库
#   （datasource / middleware 若干 starter），**不覆盖本模块**。两者容易被误认为
#   「本仓已有 CI」，实际是覆盖范围的空洞。修复 removeFilter 不对称那类缺陷时，
#   若无本门禁，热更新无效只能靠人工在跑着的环境里手点发现。
#
# 已踩过的坑（AGENTS.md 有完整记录，此处只列与本文件相关的）：
#   - 本模块父 pom 的 argLine 取自 enable.preview.jvm.args 属性，命令行 -DargLine
#     覆盖不了它；要给测试 JVM 传参数必须用 -Denable.preview.jvm.args
#   - skipTests 默认为真，Tests run 为 0 时同样 BUILD SUCCESS，故末尾显式核对
#   - paths 含 .github/workflows 自身，避免只改 CI 定义不触发任何检查
name: Common Starter Gate

on:
  push:
    branches: [ main, master ]
    paths:
      - "**/src/main/**"
      - "**/src/test/**"
      - "**/pom.xml"
      - "libs/**"
      - ".github/workflows/**"
  pull_request:
    branches: [ main, master ]
    paths:
      - "**/src/main/**"
      - "**/src/test/**"
      - "**/pom.xml"
      - "libs/**"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: common-starter-gate-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

env:
  TARGET_MODULE: utils-support-core-parent/utils-support-common-starter

jobs:
  gate:
    name: Common Starter Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      - name: Configure Maven servers
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ github.token }}</password>
              </server>
              <server>
                <id>github-resource</id>
                <username>${{ github.actor }}</username>
                <password>${{ github.token }}</password>
              </server>
              <server>
                <id>2676178-release-jmLEdB</id>
                <username>${{ secrets.ALIYUN_PACKAGES_USERNAME }}</username>
                <password>${{ secrets.ALIYUN_PACKAGES_PASSWORD }}</password>
              </server>
              <server>
                <id>2676178-snapshot-FwAJpk</id>
                <username>${{ secrets.ALIYUN_PACKAGES_USERNAME }}</username>
                <password>${{ secrets.ALIYUN_PACKAGES_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF

      # vector-api 是 JDK 25 Vector API 的 plain jar，未发布到任何仓库，需先本地安装，
      # 否则依赖解析会失败（与 engine-integration-tests.yml 中的处理保持一致）。
      - name: Install bundled vector-api
        run: |
          if [ -f libs/vector-api-4.0.0.42.jar ]; then
            mvn install:install-file -q \
              -Dfile=libs/vector-api-4.0.0.42.jar \
              -DpomFile=libs/vector-api-4.0.0.42.pom
          else
            echo "::warning::libs/vector-api-4.0.0.42.jar 不存在，若依赖解析失败请先补齐该文件"
          fi

      - name: Run tests
        run: |
          set -euo pipefail
          LOG=target/common-starter-gate.log
          mvn test \
            -pl "${{ env.TARGET_MODULE }}" \
            -am \
            -B \
            -DskipTests=false \
            -DfailIfNoTests=false 2>&1 | tee "$LOG"
          echo "----- Tests run summary -----"
          grep -E '^\[INFO\] Tests run: [0-9]+, Failures' "$LOG" || true
          TOTAL=$(grep -oE '^\[INFO\] Tests run: [0-9]+, Failures: 0, Errors: 0' "$LOG" \
                  | grep -oE 'Tests run: [0-9]+' \
                  | grep -oE '[0-9]+' \
                  | awk '{ s += $1 } END { print s + 0 }')
          echo "tests passed across modules = ${TOTAL}"
          if [ "${TOTAL}" -lt 1 ]; then
            echo "::error::门禁未跑到任何测试，本模块曾长期只有 main() 程序冒充测试，本门禁视为失败"
            exit 1
          fi