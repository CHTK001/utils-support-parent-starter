# 引擎家族 Testcontainers 集成测试
#
# 覆盖模块（6 外部容器 + 1 内存引擎）：
#   MySQL / Oracle / Redis / Neo4j / Elasticsearch / HBase / InfluxDB
# RocksDB 为嵌入式本地引擎，单元测试使用 @TempDir，不依赖 Docker，
# 由常规 mvn test 覆盖，不列入 Testcontainers 集成测试。
#
# 需求：
#   - JDK 25 (temurin)
#   - Docker（ubuntu-latest 自带）
#   - vm.max_map_count >= 262144（Elasticsearch 8.x 要求）
#
# 注意：
#   - 根 pom skipTests=true，CI 必须显式 -DskipTests=false
#   - 不做全仓库编译/测试：仓库中 utils-support-ast-starter 等无关模块存在
#     历史编译问题（JDK 25 下 javadoc 损坏），为避免被牵连，只对目标模块
#     及其依赖链（-am）执行编译与测试

name: Engine Integration Tests

on:
  push:
    branches: [ main, master ]
    paths:
      - "**/src/test/**"
      - "**/src/main/**"
      - "**/pom.xml"
      - "libs/**"
      - ".github/workflows/**"
  pull_request:
    branches: [ main, master ]
    paths:
      - "**/src/test/**"
      - "**/src/main/**"
      - "**/pom.xml"
      - "libs/**"
      - ".github/workflows/**"
  workflow_dispatch:

# 只在 push 时取消进行中的同类运行，workflow_dispatch 排队不取消。
# group 必须带 event_name：dispatch 并不豁免 concurrency，同 group 的 push 照样会取消它。
concurrency:
  group: engine-integration-tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  TARGET_MODULES: >-
    utils-support-datasource-parent/utils-support-mysql-starter,
    utils-support-datasource-parent/utils-support-oracle-starter,
    utils-support-middleware-parent/utils-support-redis-starter,
    utils-support-datasource-parent/utils-support-neo4j-starter,
    utils-support-datasource-parent/utils-support-elasticsearch-starter,
     utils-support-datasource-parent/utils-support-hbase-starter,
     utils-support-datasource-parent/utils-support-influxdb-starter

jobs:
  # ──────────────────────────────────────────────────────
  # Job 1: 目标模块编译验证（快速门禁）
  # ──────────────────────────────────────────────────────
  build:
    name: Compile Target Modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      # setup-java 只生成 server-id=github 的 settings.xml，
      # 覆盖补上 github-resource（GitHub Packages 私有仓库）与
      # 2676178-*（阿里云 packages 私有仓库，chronicle 等依赖需要）的凭据
      - name: Configure Maven servers
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ github.token }}</password>
              </server>
              <server>
                <id>github-resource</id>
                <username>${{ github.actor }}</username>
                <password>${{ github.token }}</password>
              </server>
              <!--
                凭据改走仓库 Secrets，不再写死在工作流里。
                原值（60fe204f3c458713ddc3889e / mo7_coLcrZtG）已进 git 历史，
                任何有仓库读权限的人都能拿到，必须**轮换**。
                需要在 Settings → Secrets 里配置两个名字：
                  ALIYUN_PACKAGES_USERNAME
                  ALIYUN_PACKAGES_PASSWORD
                没配之前这两个 server 凭据为空，依赖解析会失败 —— 这是预期的。
              -->
              <server>
                <id>2676178-release-jmLEdB</id>
                <username>${{ secrets.ALIYUN_PACKAGES_USERNAME }}</username>
                <password>${{ secrets.ALIYUN_PACKAGES_PASSWORD }}</password>
              </server>
              <server>
                <id>2676178-snapshot-FwAJpk</id>
                <username>${{ secrets.ALIYUN_PACKAGES_USERNAME }}</username>
                <password>${{ secrets.ALIYUN_PACKAGES_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF

      # vector-api 是 JDK 25 Vector API 的 plain jar，未发布到远程仓库，
      # 随仓库 libs/ 提交，编译前先本地安装到 .m2
      - name: Install bundled vector-api
        run: mvn install:install-file -q -Dfile=libs/vector-api-4.0.0.42.jar -DpomFile=libs/vector-api-4.0.0.42.pom

      # datalake-sink-api-starter 同样是未发布到任何远程仓库的内部包，
      # chronicle-starter 依赖它（provided）；用 generatePom 避免 parent 解析
      - name: Install bundled datalake-sink-api-starter
        run: mvn install:install-file -q -Dfile=libs/utils-support-datalake-sink-api-starter-4.0.0.42.jar -DgroupId=com.chua -DartifactId=utils-support-datalake-sink-api-starter -Dversion=4.0.0.42 -Dpackaging=jar

      - name: Compile targets (+ dependencies)
        run: mvn test-compile -q -pl "${{ env.TARGET_MODULES }}" -am

  # ──────────────────────────────────────────────────────
  # Job 2: Testcontainers 集成测试（真实容器）
  # ──────────────────────────────────────────────────────
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      # 同 build job：补 GitHub Packages + 阿里云 packages 私有仓库凭据
      - name: Configure Maven servers
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ github.token }}</password>
              </server>
              <server>
                <id>github-resource</id>
                <username>${{ github.actor }}</username>
                <password>${{ github.token }}</password>
              </server>
              <!--
                凭据改走仓库 Secrets，不再写死在工作流里。
                原值（60fe204f3c458713ddc3889e / mo7_coLcrZtG）已进 git 历史，
                任何有仓库读权限的人都能拿到，必须**轮换**。
                需要在 Settings → Secrets 里配置两个名字：
                  ALIYUN_PACKAGES_USERNAME
                  ALIYUN_PACKAGES_PASSWORD
                没配之前这两个 server 凭据为空，依赖解析会失败 —— 这是预期的。
              -->
              <server>
                <id>2676178-release-jmLEdB</id>
                <username>${{ secrets.ALIYUN_PACKAGES_USERNAME }}</username>
                <password>${{ secrets.ALIYUN_PACKAGES_PASSWORD }}</password>
              </server>
              <server>
                <id>2676178-snapshot-FwAJpk</id>
                <username>${{ secrets.ALIYUN_PACKAGES_USERNAME }}</username>
                <password>${{ secrets.ALIYUN_PACKAGES_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF

      # vector-api 是 JDK 25 Vector API 的 plain jar，未发布到远程仓库，
      # 随仓库 libs/ 提交，编译前先本地安装到 .m2
      - name: Install bundled vector-api
        run: mvn install:install-file -q -Dfile=libs/vector-api-4.0.0.42.jar -DpomFile=libs/vector-api-4.0.0.42.pom

      # datalake-sink-api-starter 同样是未发布到任何远程仓库的内部包，
      # chronicle-starter 依赖它（provided）；用 generatePom 避免 parent 解析
      - name: Install bundled datalake-sink-api-starter
        run: mvn install:install-file -q -Dfile=libs/utils-support-datalake-sink-api-starter-4.0.0.42.jar -DgroupId=com.chua -DartifactId=utils-support-datalake-sink-api-starter -Dversion=4.0.0.42 -Dpackaging=jar

      # Elasticsearch 8.x 要求 vm.max_map_count >= 262144
      - name: Increase vm.max_map_count
        run: sudo sysctl -w vm.max_map_count=262144

      # 安装目标模块及其依赖链到 .m2（skipTests=true 的仓库，install 不跑测试）
      - name: Install target modules (+ dependencies)
        run: mvn install -q -pl "${{ env.TARGET_MODULES }}" -am

      - name: Run engine integration tests
        run: |
          mvn test \
            -pl "${{ env.TARGET_MODULES }}" \
            -DskipTests=false \
            -DfailIfNoTests=false