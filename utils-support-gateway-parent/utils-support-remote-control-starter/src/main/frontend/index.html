<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>远程桌面控制</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: #eee; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; }
    #sidebar { width: 260px; background: #16213e; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    #sidebar h2 { font-size: 16px; color: #0f3460; margin-bottom: 4px; }
    #sidebar label { font-size: 12px; color: #888; }
    #sidebar input, #sidebar select { width: 100%; padding: 6px 8px; background: #0f3460; border: 1px solid #1a3a6a; color: #eee; border-radius: 4px; font-size: 13px; }
    #sidebar button { padding: 8px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
    #btnConnect { background: #e94560; color: #fff; }
    #btnConnect.connected { background: #e94560; }
    #btnConnect:disabled { opacity: 0.5; cursor: not-allowed; }
    #status { font-size: 12px; padding: 6px; border-radius: 4px; background: #0f3460; min-height: 20px; word-break: break-all; }
    #status.ok { color: #4ade80; }
    #status.err { color: #f87171; }
    #main { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
    #canvas { max-width: 100%; max-height: 100%; image-rendering: auto; }
    #fps { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.6); padding: 4px 10px; border-radius: 4px; font-size: 13px; }
    #info { position: absolute; bottom: 12px; left: 12px; font-size: 12px; color: #888; }
  </style>
</head>
<body>
  <div id="sidebar">
    <h2>远程桌面控制</h2>
    <label>目标 ID</label>
    <input id="inputTargetId" value="71bdfb4cf308" />
    <label>验证码</label>
    <input id="inputVerifyCode" value="9f2570" />
    <label>编码格式</label>
    <select id="selectCodec">
      <option value="JPEG">JPEG（浏览器原生）</option>
      <option value="H264">H.264（需要浏览器支持）</option>
    </select>
    <button id="btnConnect" onclick="toggleConnect()">连接</button>
    <div id="status">就绪</div>
  </div>
  <div id="main">
    <canvas id="canvas"></canvas>
    <div id="fps">-- fps</div>
    <div id="info">等待连接...</div>
  </div>
  <script>
    function toggleConnect() {
      const btn = document.getElementById('btnConnect');
      const app = window.__app;
      if (!app) return;
      if (app.connected) {
        app.disconnect();
        btn.textContent = '连接';
        btn.disabled = false;
      } else {
        const targetId = document.getElementById('inputTargetId').value;
        const verifyCode = document.getElementById('inputVerifyCode').value;
        const codec = document.getElementById('selectCodec').value;
        btn.disabled = true;
        btn.textContent = '连接中...';
        app.connect(targetId, verifyCode, codec);
      }
    }
    window.addEventListener('load', () => {
      const app = window.__app;
      if (app) {
        app.$watch('connected', (val) => {
          const btn = document.getElementById('btnConnect');
          if (btn) {
            btn.textContent = val ? '断开' : '连接';
            btn.disabled = false;
          }
          const status = document.getElementById('status');
          if (status) {
            status.textContent = val ? '已连接' : '就绪';
            status.className = val ? 'ok' : '';
          }
        });
        app.$watch('infoText', (val) => {
          const status = document.getElementById('status');
          if (status && !app.connected) {
            status.textContent = val || '就绪';
          }
        });
      }
    });
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
