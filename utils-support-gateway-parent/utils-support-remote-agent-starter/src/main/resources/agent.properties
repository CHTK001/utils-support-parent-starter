# Remote Agent 配置文件
# 安装后修改此文件，然后重启 agent 服务即可生效
# 优先级: 命令行参数 > 环境变量 > 此文件 > 默认值

# 网关服务器地址
gateway.host=127.0.0.1

# 网关 Agent 端口
gateway.port=9001

# Agent 唯一标识（留空则自动生成 UUID）
# agent.id=

# Agent 密钥（需与网关配置一致）
agent.secret=gateway-agent-secret

# 支持的协议，逗号分隔（SSH/DESKTOP/SOCKS5）
agent.protocols=SSH,DESKTOP,SOCKS5

# 传输协议
agent.transport=TCP

# 最大重连次数（<=0 表示无限重连）
agent.reconnect.max-attempts=0

# 验证码（网关开启验证时填写）
# agent.verify-code=

# ===== RustDesk 相关配置（通过 capabilities 传递）=====
# RustDesk hbbs 服务器地址（自建中继服务器时填写）
# rustdesk.server-host=

# RustDesk hbbs 公钥（id_ed25519.pub 内容）
# rustdesk.server-key=

# RustDesk 可执行文件路径（本地路径，优先级最高）
# rustdesk.exe-path=

# RustDesk 密码轮换间隔（秒），0=不轮换，默认 1800
# rustdesk.password-rotation=1800

# RustDesk 工作目录（默认 ~/.rustdesk-agent）
# rustdesk.work-dir=