# utils-support-gateway-server-starter 默认配置
# 可被 ${user.home}/.utils-support-gateway/gateway.properties 覆盖

# HTTP 服务端口
gateway.http.port=8080

# guacd 子进程端口（RDP 场景使用）
gateway.guacd.port=4822

# Docker API 地址（本机无 guacd 二进制时，通过远程 Docker 自动拉起 guacd 容器）
gateway.guacd.docker-host=http://172.16.0.40:2375
# Docker guacd 镜像
gateway.guacd.docker-image=guacamole/guacd:latest

# artifact 默认下载目录（本地回退优先）
gateway.artifact.dir=${user.home}/.utils-support-gateway/cache
gateway.artifact.local-override.dir=${user.home}/.utils-support-gateway/local-override

# 嵌入式 sqlite DB（也可换 MySQL/Postgres）
gateway.db.url=jdbc:sqlite:${user.home}/.utils-support-gateway/gateway.db
