<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>接入网关架构图 — G6 交互查看器</title>
<script src="https://unpkg.com/@antv/g6@4.8.24/dist/g6.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0f1419; --surface: #1a2332; --surface2: #243044;
  --border: #2d3f50; --text: #e1e8ed; --text2: #8899a6;
  --accent: #1da1f2; --accent2: #17bf63; --accent3: #ffad1f; --danger: #e74c3c;
  --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,.35);
  --shadow-lg: 0 8px 28px rgba(0,0,0,.45);
  --glass-bg: rgba(26,35,50,.75);
  --glass-border: rgba(45,63,80,.5);
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', 'Noto Sans CJK SC', sans-serif;
  background: var(--bg); color: var(--text);
  display: flex; height: 100vh; overflow: hidden;
}
:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
  border-radius: var(--radius-sm);
}
.sidebar {
  width: 220px; min-width: 220px;
  background: linear-gradient(180deg, #1a2332 0%, #1e293b 100%);
  border-right: 1px solid var(--glass-border);
  display: flex; flex-direction: column; height: 100vh;
  box-shadow: var(--shadow-md);
  z-index: 10;
}
.sidebar-header {
  padding: 20px 16px 14px;
  background: linear-gradient(135deg, rgba(29,161,242,.08), transparent);
  border-bottom: 1px solid var(--glass-border);
  position: relative;
}
.sidebar-header::after {
  content: ''; position: absolute; bottom: -1px; left: 16px; right: 16px;
  height: 1px; background: linear-gradient(90deg, var(--accent), transparent 60%);
}
.sidebar-header h1 { font-size: 14px; font-weight: 800; color: var(--accent); letter-spacing: .3px; }
.sidebar-header .sub { font-size: 10.5px; color: var(--text2); margin-top: 3px; opacity: .7; }
.sidebar nav {
  flex: 1; overflow-y: auto; overflow-x: hidden; padding: 6px 0 12px;
  scrollbar-width: thin; scrollbar-color: #2d3f50 transparent;
}
.sidebar nav::-webkit-scrollbar { width: 4px; }
.sidebar nav::-webkit-scrollbar-track { background: transparent; }
.sidebar nav::-webkit-scrollbar-thumb { background: #2d3f50; border-radius: 4px; }
.sidebar nav::-webkit-scrollbar-thumb:hover { background: #4a5b6c; }
.sidebar nav a {
  display: flex; align-items: center; gap: 8px; padding: 7px 16px 7px 14px;
  color: var(--text2); text-decoration: none; font-size: 12.5px;
  transition: all .18s var(--ease); border-left: 3px solid transparent;
  cursor: pointer; position: relative;
}
.sidebar nav a:hover {
  color: var(--text); background: rgba(29,161,242,.07);
  border-left-color: rgba(29,161,242,.3);
}
.sidebar nav a:active { transform: scale(.98); }
.sidebar nav a.active {
  border-left-color: var(--accent); color: var(--accent);
  background: linear-gradient(90deg, rgba(29,161,242,.12), rgba(29,161,242,.03));
  font-weight: 600;
}
.sidebar nav a.active::before {
  content: ''; position: absolute; top: 50%; left: -1px;
  width: 6px; height: 60%; transform: translateY(-50%);
  background: linear-gradient(90deg, rgba(29,161,242,.4), transparent);
  border-radius: 0 3px 3px 0;
  pointer-events: none;
}
.sidebar nav a .num {
  color: var(--text2); font-size: 10px; min-width: 18px;
  opacity: .4; font-variant-numeric: tabular-nums;
  transition: opacity .18s var(--ease);
}
.sidebar nav a:hover .num { opacity: .7; }
.sidebar nav a.active .num { opacity: 1; color: var(--accent); }
.main { flex: 1; display: flex; flex-direction: column; height: 100vh; min-width: 0; }
.topbar {
  display: flex; align-items: center; gap: 12px; padding: 10px 24px;
  background: linear-gradient(180deg, #1e293b 0%, #1a2332 100%);
  border-bottom: 1px solid var(--glass-border);
  box-shadow: 0 1px 4px rgba(0,0,0,.2); z-index: 5;
}
.topbar .title-area { flex: 1; min-width: 0; }
.topbar .title-area h2 {
  font-size: 16px; font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  background: linear-gradient(90deg, var(--text) 60%, var(--text2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.topbar .title-area .desc { font-size: 11.5px; color: var(--text2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .8; }
.topbar .counter {
  font-size: 11px; color: var(--text2); padding: 2px 10px;
  background: rgba(45,63,80,.4); border-radius: 10px;
  border: 1px solid var(--glass-border); flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}
.toolbar {
  display: flex; align-items: center; gap: 3px; padding: 5px 20px;
  background: linear-gradient(0deg, #1a2332 0%, #1e293b 100%);
  border-bottom: 1px solid var(--glass-border);
  box-shadow: 0 1px 4px rgba(0,0,0,.15);
  z-index: 5; min-height: 34px;
}
.toolbar .spacer { flex: 1; }
.toolbar .hint {
  font-size: 10px; color: var(--text2); margin-right: 6px;
  opacity: .6; white-space: nowrap; flex-shrink: 0;
}
.toolbar .sep {
  width: 1px; height: 18px;
  background: linear-gradient(180deg, transparent, #2d3f50, transparent);
  margin: 0 4px; flex-shrink: 0;
}
.toolbar button {
  border: 1px solid transparent; background: transparent; border-radius: var(--radius-sm);
  padding: 4px 10px; font-size: 11.5px; cursor: pointer; color: var(--text2);
  transition: all .15s var(--ease); white-space: nowrap; flex-shrink: 0;
}
.toolbar button:hover {
  color: var(--text); background: rgba(255,255,255,.04);
  border-color: rgba(255,255,255,.08);
  box-shadow: 0 1px 4px rgba(0,0,0,.2);
}
.toolbar button:active { transform: scale(.95); }
.toolbar button.primary {
  background: linear-gradient(135deg, rgba(29,161,242,.15), rgba(29,161,242,.08));
  border-color: rgba(29,161,242,.2); color: var(--accent); font-weight: 600;
}
.toolbar button.primary:hover {
  background: linear-gradient(135deg, rgba(29,161,242,.25), rgba(29,161,242,.12));
  border-color: rgba(29,161,242,.4);
  box-shadow: 0 1px 8px rgba(29,161,242,.15);
}
.toolbar button.export {
  background: linear-gradient(135deg, rgba(23,191,99,.12), rgba(23,191,99,.06));
  border-color: rgba(23,191,99,.15); color: var(--accent2);
}
.toolbar button.export:hover {
  background: linear-gradient(135deg, rgba(23,191,99,.22), rgba(23,191,99,.1));
  border-color: rgba(23,191,99,.3);
  box-shadow: 0 1px 8px rgba(23,191,99,.12);
}
.speed-control {
  display: flex; align-items: center; gap: 3px; margin-right: 4px;
  padding: 2px 6px; border-radius: var(--radius-sm);
  transition: background .15s var(--ease); flex-shrink: 0;
}
.speed-control:hover { background: rgba(255,255,255,.03); }
.speed-control label { font-size: 12px; cursor: pointer; line-height: 1; }
.speed-control input[type=range] {
  -webkit-appearance: none; appearance: none;
  width: 56px; height: 2px; border-radius: 2px;
  background: linear-gradient(90deg, #2d3f50, #4a5b6c);
  outline: none; cursor: pointer;
  transition: height .15s var(--ease);
}
.speed-control input[type=range]:hover { height: 3px; }
.speed-control input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 11px; height: 11px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #4db8ff, var(--accent));
  border: 2px solid #0f1419; cursor: pointer;
  transition: transform .15s var(--ease-bounce), box-shadow .15s var(--ease);
  box-shadow: 0 0 0 2px rgba(29,161,242,.2);
}
.speed-control input[type=range]::-webkit-slider-thumb:hover {
  transform: scale(1.25);
  box-shadow: 0 0 0 4px rgba(29,161,242,.15);
}
.speed-control input[type=range]::-moz-range-thumb {
  width: 11px; height: 11px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #4db8ff, var(--accent));
  border: 2px solid #0f1419; cursor: pointer;
  box-shadow: 0 0 0 2px rgba(29,161,242,.2);
}
.speed-val {
  font-size: 10px; color: var(--text2); min-width: 28px;
  text-align: center; font-variant-numeric: tabular-nums;
  opacity: .7; transition: opacity .15s var(--ease), color .15s var(--ease);
}
.speed-control:hover .speed-val { opacity: 1; }
.canvas-wrap { flex: 1; position: relative; overflow: hidden; }
#g6-container { width: 100%; height: 100%; }
.g6-tooltip {
  background: linear-gradient(135deg, #1e293b, #1a2332) !important;
  border: 1px solid var(--glass-border) !important;
  border-radius: var(--radius-md) !important;
  color: var(--text) !important; font-size: 12px !important;
  padding: 10px 14px !important;
  box-shadow: var(--shadow-lg), 0 0 0 1px rgba(29,161,242,.05) !important;
  max-width: 280px; line-height: 1.5;
}
.g6-minimap {
  position: absolute !important; bottom: 16px !important; right: 16px !important;
  border: 1px solid var(--glass-border) !important;
  border-radius: var(--radius-md) !important;
  box-shadow: var(--shadow-lg) !important;
  background: #0f1419 !important; overflow: hidden;
  transition: transform .18s var(--ease), box-shadow .18s var(--ease);
}
.g6-minimap:hover {
  transform: scale(1.02);
  box-shadow: 0 8px 32px rgba(0,0,0,.5) !important;
}
.g6-minimap canvas { border-radius: 6px; }
body.fullscreen .sidebar, body.fullscreen .topbar, body.fullscreen .toolbar { display: none !important; }
body.fullscreen .canvas-wrap {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  z-index: 1000; background: #0f1419;
}
#fullscreenExitBtn {
  position: fixed; top: 16px; right: 16px; z-index: 1100;
  border: 1px solid var(--glass-border);
  background: linear-gradient(135deg, rgba(26,35,50,.88), rgba(30,41,59,.88));
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-radius: var(--radius-md); padding: 8px 14px;
  font-size: 12px; cursor: pointer; color: var(--text2); display: none;
  align-items: center; gap: 6px;
  box-shadow: var(--shadow-md);
  transition: all .15s var(--ease);
}
body.fullscreen #fullscreenExitBtn { display: flex; }
#fullscreenExitBtn:hover {
  color: var(--text); background: linear-gradient(135deg, rgba(26,35,50,.95), rgba(30,41,59,.95));
  border-color: rgba(255,255,255,.15);
  box-shadow: var(--shadow-lg);
}
#fullscreenExitBtn:active { transform: scale(.96); }
#fullscreenExitBtn .hint { font-size: 10px; color: var(--text2); opacity: .5; }
@media (max-width: 768px) {
  .sidebar { width: 160px; min-width: 160px; }
  .sidebar-header { padding: 14px 12px 10px; }
  .sidebar-header h1 { font-size: 12px; }
  .sidebar nav a { font-size: 11px; padding: 6px 10px 6px 8px; }
  .topbar { padding: 8px 12px; gap: 8px; }
  .topbar .title-area h2 { font-size: 13px; }
  .topbar .title-area .desc { font-size: 10px; }
  .toolbar { padding: 4px 10px; gap: 2px; flex-wrap: wrap; }
  .toolbar button { font-size: 10px; padding: 3px 7px; }
  .toolbar .hint { display: none; }
  .speed-control input[type=range] { width: 40px; }
}
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <h1>接入网关架构图</h1>
    <div class="sub">G6 · 共 11 张图</div>
  </div>
  <nav id="sidebarNav"></nav>
</div>

<div class="main">
  <div class="topbar">
    <div class="title-area">
      <h2 id="diagramTitle">整体架构总览</h2>
      <div class="desc" id="diagramDesc">控制端 → 网关 → Agent / 持久化层的全局架构关系</div>
    </div>
    <div class="counter" id="diagramCounter">1 / 11</div>
  </div>
  <div class="toolbar">
    <span class="hint">点击节点高亮关联 · 滚轮缩放 · 拖拽平移</span>
    <button onclick="prevDiagram()" class="primary" title="上一张 (←)">◀ 上一张</button>
    <button onclick="nextDiagram()" class="primary" title="下一张 (→)">下一张 ▶</button>
    <span class="sep"></span>
    <div class="spacer"></div>
    <div class="speed-control">
      <label for="speedSlider" title="数据流动画速度">🎬</label>
      <input type="range" id="speedSlider" min="0" max="2" step="0.05" value="0.4"
        oninput="setAnimSpeed(this.value)">
      <span id="speedLabel" class="speed-val">0.4×</span>
    </div>
    <button onclick="zoomIn()">+ 放大</button>
    <button onclick="zoomOut()">- 缩小</button>
    <button onclick="resetZoom()">⟲ 重置</button>
    <button onclick="fitView()">⊞ 自适应</button>
    <button onclick="exportPng()" class="export" title="导出为 PNG">⬇ 导出</button>
    <button onclick="toggleFullscreen()" id="fullscreenBtn">⛶ 全屏</button>
  </div>
  <div class="canvas-wrap">
    <div id="g6-container"></div>
  </div>
</div>

<button id="fullscreenExitBtn" onclick="toggleFullscreen()">⛶ 退出全屏 <span class="hint">Esc</span></button>

<script>
const C = {
  blue: { fill: '#1da1f2', stroke: '#1688d4', text: '#fff' },
  green: { fill: '#17bf63', stroke: '#14a855', text: '#fff' },
  orange: { fill: '#ffad1f', stroke: '#e89a1a', text: '#1a2332' },
  purple: { fill: '#794bc4', stroke: '#6a3db5', text: '#fff' },
  red: { fill: '#e74c3c', stroke: '#c0392b', text: '#fff' },
  teal: { fill: '#1abc9c', stroke: '#16a085', text: '#fff' },
  amber: { fill: '#f39c12', stroke: '#d68910', text: '#1a2332' },
  gray: { fill: '#5a6b7c', stroke: '#4a5b6c', text: '#fff' },
  indigo: { fill: '#5c6bc0', stroke: '#3f51b5', text: '#fff' },
};

function node(id, label, color, extra) {
  const c = C[color] || C.gray;
  return Object.assign({
    id, label, desc: (extra && extra.desc) || '',
    type: (color === 'orange' ? 'port' : color === 'blue' ? 'comp' : color === 'green' ? 'agent' : color === 'teal' ? 'sys' : color === 'red' ? 'auth' : color === 'purple' ? 'stor' : color === 'amber' ? 'dec' : color === 'indigo' ? 'indigo' : 'gray') + '-node',
    style: { fill: c.fill, stroke: c.stroke },
    labelCfg: { style: { fill: c.text, fontSize: 12, fontWeight: 500 } },
  }, extra || {});
}
function portNode(id, label, e) { return node(id, label, 'orange', Object.assign({size:[100,32]}, e||{})); }
function compNode(id, label, e) { return node(id, label, 'blue', Object.assign({size:[150,38]}, e||{})); }
function agentNode(id, label, e) { return node(id, label, 'green', Object.assign({size:[140,34]}, e||{})); }
function sysNode(id, label, e) { return node(id, label, 'teal', Object.assign({size:[150,36]}, e||{})); }
function authNode(id, label, e) { return node(id, label, 'red', Object.assign({size:[130,34]}, e||{})); }
function storNode(id, label, e) { return node(id, label, 'purple', Object.assign({size:[130,32]}, e||{})); }
function decNode(id, label, e) {
  return node(id, label, 'amber', Object.assign({
    type: 'dec-node', size:[70,50],
    labelCfg: { style: { fill: '#1a2332', fontSize: 11, fontWeight: 500 } },
  }, e||{}));
}

const NODE_STYLE_MAP = {
  'port':   { fill:'#ffad1f', stroke:'#e89a1a', text:'#1a2332', radius: 6 },
  'comp':   { fill:'#1da1f2', stroke:'#1688d4', text:'#fff',    radius: 6 },
  'agent':  { fill:'#17bf63', stroke:'#14a855', text:'#fff',    radius: 6 },
  'sys':    { fill:'#1abc9c', stroke:'#16a085', text:'#fff',    radius: 6 },
  'auth':   { fill:'#e74c3c', stroke:'#c0392b', text:'#fff',    radius: 6 },
  'stor':   { fill:'#794bc4', stroke:'#6a3db5', text:'#fff',    radius: 6 },
  'dec':    { fill:'#f39c12', stroke:'#d68910', text:'#1a2332', radius: 0 },
  'gray':   { fill:'#5a6b7c', stroke:'#4a5b6c', text:'#fff',    radius: 6 },
  'indigo': { fill:'#5c6bc0', stroke:'#3f51b5', text:'#fff',    radius: 6 },
};

Object.keys(NODE_STYLE_MAP).forEach(k => {
  const s = NODE_STYLE_MAP[k];
  const isDiamond = k === 'dec';
  G6.registerNode(k + '-node', {
    draw(cfg, group) {
      const size = cfg.size || [150, 36];
      const w = size[0], h = size[1];
      const shapeType = isDiamond ? 'diamond' : 'rect';
      const key = group.addShape(shapeType, {
        attrs: {
          width: w, height: h, x: -w/2, y: -h/2,
          fill: s.fill, stroke: s.stroke, lineWidth: 1.5,
          radius: s.radius, cursor: 'pointer',
        },
        name: 'body',
      });
      group.addShape('text', {
        attrs: {
          text: cfg.label || '', x: 0, y: 0,
          fill: s.text, fontSize: 12, fontWeight: 500,
          textAlign: 'center', textBaseline: 'middle',
        },
        name: 'label',
      });
      return key;
    },
    getAnchorPoints(cfg) {
      const lp = (cfg.linkPoints || {});
      const anchors = [];
      if (lp.top !== false)    anchors.push([0.5, 0]);
      if (lp.bottom !== false) anchors.push([0.5, 1]);
      if (lp.left !== false)   anchors.push([0, 0.5]);
      if (lp.right !== false)  anchors.push([1, 0.5]);
      if (anchors.length === 0) anchors.push([0.5, 0.5]);
      return anchors;
    },
  }, isDiamond ? 'single-shape' : 'single-shape');
});

function edge(id, src, tgt, label, style) {
  return {
    id, source: src, target: tgt, label: label || '', animated: false,
    radius: 4, offset: 12,
    style: Object.assign({
      stroke: '#4a5b6c', lineWidth: 1.2,
      endArrow: { path: G6.Arrow.vee(6, 6), fill: '#4a5b6c' },
    }, style || {}),
    labelCfg: {
      style: { fill: '#8899a6', fontSize: 10, background: { fill: '#0f1419', padding: [2, 4] } },
    },
  };
}
function flowEdge(id, src, tgt, label) {
  const e = edge(id, src, tgt, label, { stroke: '#17bf63' });
  e.animated = true;
  e.style.lineDash = [10, 5];
  if (e.style.endArrow) e.style.endArrow.fill = '#17bf63';
  return e;
}
function combo(id, label, pid, style) {
  return {
    id, label, parentId: pid || undefined,
    style: Object.assign({ fill: 'rgba(26,35,50,.6)', stroke: '#2d3f50', lineWidth: 1, opacity: .9 }, style || {}),
    labelCfg: { style: { fill: '#e1e8ed', fontSize: 12, fontWeight: 700 } },
    padding: [20, 16, 20, 16],
  };
}

const DIAGRAMS = [
  { id:'arch-overview', title:'整体架构总览', desc:'控制端 → 网关 → Agent / 持久化层',
    layout:{type:'dagre',rankdir:'TB',nodesep:40,ranksep:60},
    combos:[combo('c-ctrl','控制端'),combo('c-gw','网关'),combo('c-core','核心组件','c-gw'),combo('c-spi','SPI扩展','c-gw'),combo('c-ag','Agent'),combo('c-st','持久化')],
    nodes:[
      node('browser','浏览器 Web UI','indigo',{comboId:'c-ctrl',size:[130,34]}),node('cli','CLI 客户端','indigo',{comboId:'c-ctrl',size:[110,32]}),node('app','移动端 App','indigo',{comboId:'c-ctrl',size:[110,32]}),
      portNode('p9000','9000 TCP-CTRL',{comboId:'c-gw'}),portNode('p8082','8082 DWS',{comboId:'c-gw'}),portNode('p3000','3000 HTTP-MGMT',{comboId:'c-gw'}),portNode('p8083','8083 HTTP-API',{comboId:'c-gw'}),portNode('p8081','8081 WS-API',{comboId:'c-gw'}),portNode('p1080','1080 SOCKS5',{comboId:'c-gw'}),portNode('p9001','9001 TCP-AGENT',{comboId:'c-gw'}),
      compNode('ar','AgentRegistry',{comboId:'c-core'}),compNode('tr','TargetRegistry',{comboId:'c-core'}),compNode('sm','SessionManager',{comboId:'c-core'}),compNode('cr','ControllerRegistry',{comboId:'c-core'}),compNode('fw','GatewayFirewall',{comboId:'c-core',size:[140,38]}),compNode('rl','RateLimiter',{comboId:'c-core',size:[130,34]}),compNode('ah','AuthHandler',{comboId:'c-core'}),compNode('am','AclManager',{comboId:'c-core'}),
      sysNode('gcs','ConfigStore',{comboId:'c-spi'}),sysNode('gtv','TokenVerifier',{comboId:'c-spi',size:[140,34]}),sysNode('gfp','FirewallSPI',{comboId:'c-spi',size:[140,34]}),sysNode('rtp','TransportSPI',{comboId:'c-spi',size:[140,34]}),
      agentNode('ssh-ag','SSH Agent',{comboId:'c-ag',size:[120,32]}),agentNode('desk-ag','Desktop',{comboId:'c-ag',size:[130,32]}),agentNode('s5-ag','SOCKS5',{comboId:'c-ag',size:[130,32]}),agentNode('http-ag','HTTP Agent',{comboId:'c-ag',size:[140,34]}),
      storNode('json-st','JSON',{comboId:'c-st'}),storNode('sql-st','SQLite',{comboId:'c-st'}),storNode('db-st','Database',{comboId:'c-st'}),
    ],

function getNodeMeta(m) {
  const id = m.id;
  if (NODE_META[id]) return NODE_META[id];
  for (const key of Object.keys(NODE_META)) {
    if (id.startsWith(key + '-') || id.startsWith(key + '_')) return NODE_META[key];
  }
  if (id.startsWith('s') && /^s\\d+$/.test(id)) return { icon:'📌', type:'步骤', detail:'流程步骤节点: ' + (m.label || '') };
  if (id.startsWith('f') && /^f\\d+$/.test(id)) return { icon:'📦', type:'字段', detail:(m.label || '') };
  if (id.startsWith('m') && /^m\\d+$/.test(id)) return { icon:'🔧', type:'方法', detail:(m.label || '') };
  if (id.startsWith('af') && /^af\\d+$/.test(id)) return { icon:'📦', type:'字段', detail:(m.label || '') };
  if (id.startsWith('am') && /^am\\d+$/.test(id)) return { icon:'🔧', type:'方法', detail:(m.label || '') };
  return null;
}

// ==================== G6 管理 ====================
let graph = null;
let currentIndex = 0;
let animFrameId = null;
let _resizeTimer = null;
let _zoomTimer = null;
const animConfig = { speed: 0.4, paused: false };

function startEdgeAnimation() {
  if (animFrameId) cancelAnimationFrame(animFrameId);
  function anim() {
    if (!graph || graph.get('destroyed')) { animFrameId = null; return; }
    if (animConfig.paused) {
      animFrameId = requestAnimationFrame(anim);
      return;
    }
    try {
      const edges = graph.getEdges();
      for (let i = 0, len = edges.length; i < len; i++) {
        const e = edges[i];
        if (e.getModel && e.getModel().animated) {
          const ks = e.get('keyShape');
          if (ks && ks.attr) {
            ks.attr('lineDashOffset', (ks.attr('lineDashOffset')||0) - animConfig.speed);
          }
        }
      }
      // 用 canvas.draw() 替代 graph.paint() —— 只绘制脏形状，不重置 canvas transform
      // 避免与 G6 zoom transform 冲突产生重影
      const canvas = graph.get('canvas');
      if (canvas && canvas.draw) canvas.draw();
    } catch(_) {}
    animFrameId = requestAnimationFrame(anim);
  }
  animFrameId = requestAnimationFrame(anim);
}
function stopEdgeAnimation() { if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; } }

function pauseAnimTemporarily() {
  animConfig.paused = true;
  clearTimeout(_zoomTimer);
  _zoomTimer = setTimeout(function() { animConfig.paused = false; }, 500);
}

function createGraph(idx) {
  var d = DIAGRAMS[idx];
  var container = document.getElementById('g6-container');
  var rect = container.getBoundingClientRect();
  var ww = Math.max(rect.width, 800), hh = Math.max(rect.height, 500);

  stopEdgeAnimation();
  if (graph) { graph.destroy(); graph = null; }

  var minimap = new G6.Minimap({
    size: [180, 130],
    className: 'g6-minimap',
    type: 'delegate',
    delegateStyle: { fill: 'rgba(29,161,242,.15)', stroke: '#1da1f2', lineWidth: 1.5 },
    refresh: true,
  });

  var tooltip = new G6.Tooltip({
    offsetX: 12, offsetY: -10, itemTypes: ['node'],
    getContent: function(e) {
      var m = e.item.getModel();
      var meta = getNodeMeta(m);
      var label = (m.label || '').replace(/\\n/g,'<br>');
      var typeColor = { '端口':'#ffad1f','核心组件':'#1da1f2','SPI':'#794bc4','SPI 接口':'#794bc4','Agent':'#17bf63','存储':'#794bc4','协议':'#1abc9c','客户端':'#5c6bc0','控制端':'#5c6bc0','网关':'#1da1f2','状态':'#ffad1f','决策':'#f39c12','识别结果':'#17bf63','字段':'#5a6b7c','方法':'#1da1f2','类':'#1abc9c','实现':'#17bf63','统计':'#8899a6','注释':'#8899a6' };
      var html = '<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">';
      html += '<span>' + (meta ? meta.icon : '📄') + '</span>';
      html += '<span style="font-weight:700;font-size:13px;color:#e1e8ed">' + label + '</span>';
      if (meta && meta.type) html += '<span style="font-size:10px;padding:1px 6px;border-radius:3px;background:' + (typeColor[meta.type]||'#5a6b7c') + '22;color:' + (typeColor[meta.type]||'#8899a6') + ';border:1px solid ' + (typeColor[meta.type]||'#5a6b7c') + '44">' + meta.type + '</span>';
      html += '</div>';
      if (meta && meta.detail) html += '<div style="font-size:11px;color:#8899a6;margin-bottom:6px;line-height:1.4">' + meta.detail + '</div>';
      else if (m.desc) html += '<div style="font-size:11px;color:#8899a6;margin-bottom:4px">' + m.desc + '</div>';
      if (meta && meta.meta) {
        html += '<div style="border-top:1px solid #2d3f50;margin-top:4px;padding-top:4px">';
        for (var key in meta.meta) {
          html += '<div style="display:flex;font-size:11px;line-height:1.7"><span style="color:#5a6b7c;min-width:52px;flex-shrink:0">' + key + '</span><span style="color:#e1e8ed">' + meta.meta[key] + '</span></div>';
        }
        html += '</div>';
      }
      return html;
    },
  });

  graph = new G6.Graph({
    container: 'g6-container',
    width: ww, height: hh,
    backgroundColor: '#0f1419',
    fitView: true, fitViewPadding: [20, 20],
    animate: false,
    modes: {
      default: ['drag-canvas', 'zoom-canvas', 'drag-node',
        { type: 'activate-relations', trigger: 'click', activeState: 'active', inactiveState: 'inactive' },
      ],
    },
    plugins: [minimap, tooltip],
    defaultNode: {
      type: 'comp-node', size: [150, 36],
      style: { fill: '#1da1f2', stroke: '#1688d4', radius: 6, lineWidth: 1.5 },
      labelCfg: { style: { fill: '#fff', fontSize: 11.5, fontWeight: 500 }, offset: [0, 0] },
    },
    defaultEdge: {
      type: 'polyline', radius: 4, offset: 12,
      style: { stroke: '#4a5b6c', lineWidth: 1.2, endArrow: { path: G6.Arrow.vee(6, 6), fill: '#4a5b6c' } },
      labelCfg: { style: { fill: '#8899a6', fontSize: 10, background: { fill: '#0f1419', padding: [2, 4] } } },
    },
    defaultCombo: {
      type: 'rect',
      style: { fill: 'rgba(26,35,50,.6)', stroke: '#2d3f50', lineWidth: 1.2, opacity: .9 },
      labelCfg: { style: { fill: '#e1e8ed', fontSize: 12, fontWeight: 700 } },
      padding: [16, 12, 16, 12],
    },
    nodeStateStyles: {
      active: { lineWidth: 3, strokeOpacity: 1 },
      inactive: { opacity: 0.35 },
    },
    edgeStateStyles: {
      active: { stroke: '#17bf63', lineWidth: 2 },
      inactive: { opacity: 0.25 },
    },
    layout: d.layout,
  });

  // 用 G6 内置事件检测交互，暂停动画
  graph.on('canvas:mousewheel', pauseAnimTemporarily);
  graph.on('canvas:dragstart', function() { animConfig.paused = true; });
  graph.on('canvas:dragend', function() {
    clearTimeout(_zoomTimer);
    _zoomTimer = setTimeout(function() { animConfig.paused = false; }, 500);
  });
  graph.on('canvas:touchstart', function() { animConfig.paused = true; });
  graph.on('canvas:touchend', function() {
    clearTimeout(_zoomTimer);
    _zoomTimer = setTimeout(function() { animConfig.paused = false; }, 500);
  });

  graph.data({ nodes: d.nodes || [], edges: d.edges || [], combos: d.combos || [] });
  graph.render();

  setTimeout(function() {
    if (graph && !graph.get('destroyed')) { try { graph.fitView([20, 20]); } catch(_) {} startEdgeAnimation(); }
  }, 300);

  document.getElementById('diagramTitle').textContent = (idx + 1) + '. ' + d.title;
  document.getElementById('diagramDesc').textContent = d.desc;
  document.getElementById('diagramCounter').textContent = (idx + 1) + ' / ' + DIAGRAMS.length;
  document.querySelectorAll('#sidebarNav a').forEach(function(a) { a.classList.toggle('active', parseInt(a.dataset.idx) === idx); });
  currentIndex = idx;
}

function setAnimSpeed(val) {
  animConfig.speed = parseFloat(val);
  document.getElementById('speedLabel').textContent = val + '×';
}

function switchDiagram(idx) { if (idx >= 0 && idx < DIAGRAMS.length) createGraph(idx); }
function prevDiagram() { switchDiagram(currentIndex - 1); }
function nextDiagram() { switchDiagram(currentIndex + 1); }

function zoomIn()  { if (graph) { pauseAnimTemporarily(); graph.zoomTo(graph.getZoom()*1.3, {x:innerWidth/2,y:300}); } }
function zoomOut() { if (graph) { pauseAnimTemporarily(); graph.zoomTo(graph.getZoom()/1.3, {x:innerWidth/2,y:300}); } }
function resetZoom() { if (graph) { pauseAnimTemporarily(); graph.zoomTo(1); graph.moveTo(0,0); } }
function fitView()  { if (graph) { pauseAnimTemporarily(); graph.fitView([20,20]); } }
function exportPng() {
  if (!graph) return;
  var url = graph.toDataURL();
  var a = document.createElement('a');
  a.href = url; a.download = 'gateway-' + DIAGRAMS[currentIndex].id + '.png'; a.click();
}

}

    a.dataset.idx = i; a.className = i === 0 ? 'active' : '';
    a.innerHTML = '<span class="num">' + String(i+1).padStart(2,'0') + '</span> ' + d.title;
    a.addEventListener('click', function() { switchDiagram(i); });
    nav.appendChild(a);
  });
})();

document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowLeft') { prevDiagram(); e.preventDefault(); }
  if (e.key === 'ArrowRight') { nextDiagram(); e.preventDefault(); }
  if (e.key === 'f' && !e.shiftKey) { fitView(); e.preventDefault(); }
  if (e.key === 'F' && e.shiftKey) { toggleFullscreen(); e.preventDefault(); }
  if (e.key === 'Escape' && document.body.classList.contains('fullscreen')) { toggleFullscreen(); e.preventDefault(); }
});

window.addEventListener('resize', function() {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(function() {
    if (graph && !graph.get('destroyed')) {
      var c = document.getElementById('g6-container').getBoundingClientRect();
      graph.changeSize(Math.max(c.width,600), Math.max(c.height,400));
      graph.fitView([20,20]);
    }
  }, 200);
});

createGraph(0);
</script>
</body>
</html>
