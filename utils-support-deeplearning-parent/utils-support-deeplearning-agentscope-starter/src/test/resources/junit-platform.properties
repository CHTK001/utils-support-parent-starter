# 把「无限卡死」变成「有界失败」。
#
# 背景（2026-10-02 实测）：AgentSubAgentRoutingTest 会挂住 —— jstack 显示主线程停在
# AgentScopeAgent.run 的 Mono.block()，且 HttpClient-* 线程每约 10s 新建一个，
# 既不发结果也不报错。该模块 pom 的 surefire 没有任何超时，于是整轮测试永久挂起，
# 「跑这个模块的测试」这件事本身不可用；install-agentscope.bat 因为 pom 硬编码
# <skipTests>false</skipTests>（POM 配置优先于命令行 -DskipTests）而照样会跑它，
# 连构建都被卡住。
#
# 已确认与业务改动无关：在 52cb5f019~1（改前）与 HEAD（改后）上分别单跑
# testPipelineMode_executesSuccessfully，两者都挂 >100s。
#
# 因此这里不臆改 harness 行为，只把结果约束成有界：
#   - 每个测试 60s 上限；
#   - 必须用 SEPARATE_THREAD —— 同线程模式下超时无法中断已阻塞的 Mono.block()，
#     等于不生效。分离线程后由 JUnit 中断测试线程，阻塞调用抛 InterruptedException，
#     测试以超时失败收场，构建不再被卡死。
#
# 实测：加此配置后整轮 22 个用例在 375s 内终止（此前永久挂起），并点出挂住的用例。
#
# 根因已于 2026-10-03 定位（见 AgentSubAgentRoutingTest.setUp 的注释），并已在测试侧修掉：
# 不设工作区时 harness 回落到 $HOME/.agentscope 这份同一 JVM 内共享的落盘状态，
# 记忆中间件每轮归并/刷写它、run() 又阻塞在 MemoryBackgroundTasks.awaitQuiescence 等其静默。
# 每用例一个独立空工作区后，整轮 84s 跑完、22 个用例全部执行完、超时归零。
# 本文件保留作为安全网：将来任何用例再退化成无界阻塞，仍会被 60s 上限挡住而不是卡死构建。
junit.jupiter.execution.timeout.default=60s
junit.jupiter.execution.timeout.testable.method.default=60s
junit.jupiter.execution.timeout.thread.mode.default=SEPARATE_THREAD
