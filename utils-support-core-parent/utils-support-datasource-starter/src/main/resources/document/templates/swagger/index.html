<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>#title# - #databaseName#</title>
<style>
  :root {
    --bg: #f5f6fa;
    --surface: #ffffff;
    --border: #e8ecf4;
    --text: #1e2330;
    --text-secondary: #5b657a;
    --text-muted: #8e96ab;
    --accent: #4f6ef7;
    --accent-light: rgba(79,110,247,0.08);
    --accent-2: #0ac28a;
    --tag-pk-bg: #fff7e6;
    --tag-pk-text: #d48806;
    --sidebar-w: 300px;
    --font: 'Inter','SF Pro','Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
    --mono: 'JetBrains Mono','SF Mono','Fira Code','Cascadia Code','Consolas',monospace;
    --radius: 10px;
    --radius-sm: 6px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{height:100%}
  body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased}
  ::-webkit-scrollbar{width:5px;height:5px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

  .app-layout{display:flex;width:100%;min-height:100vh}
  .sidebar{width:var(--sidebar-w);flex-shrink:0;max-height:100vh;position:sticky;top:0;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--border);transition:width .3s}
   .app-layout.sidebar-hidden .sidebar{width:0 !important;overflow:hidden;border-right:none}
  .app-layout.sidebar-hidden .sidebar .sidebar-header,.app-layout.sidebar-hidden .sidebar .sidebar-meta,.app-layout.sidebar-hidden .sidebar #nav,.app-layout.sidebar-hidden .sidebar .nav-empty{display:none}
  .app-layout.sidebar-hidden .sidebar .sidebar-resize-handle{display:none}
  .sidebar-resize-handle{position:absolute;top:0;right:-4px;width:8px;height:100%;cursor:col-resize;z-index:10;opacity:0;transition:opacity .2s}
  .sidebar-resize-handle:hover,.sidebar-resize-handle.active{opacity:1;background:rgba(79,110,247,0.15)}
  .sidebar:hover .sidebar-resize-handle{opacity:.4}
  .sidebar-toggle{position:fixed;top:16px;right:16px;z-index:100;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;color:var(--text-secondary);transition:all .2s;font-size:16px;box-shadow:0 2px 8px rgba(30,35,48,0.08)}
  .sidebar-toggle:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
  .sidebar-header{padding:24px 20px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
  .sidebar-header h1{font-size:16px;font-weight:700;letter-spacing:-.3px;color:var(--text);line-height:1.3}
  .sidebar-search{position:relative;margin-top:14px}
  .sidebar-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-muted);pointer-events:none}
  .sidebar-search input{width:100%;padding:9px 10px 9px 32px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-size:13px;outline:none;transition:border-color .2s,box-shadow .2s}
  .sidebar-search input::placeholder{color:var(--text-muted)}
  .sidebar-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
  .sidebar-search .kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--text-muted);background:var(--border);padding:1px 6px;border-radius:4px;font-family:var(--mono)}
  .sidebar-meta{display:flex;justify-content:space-between;align-items:center;padding:10px 20px 4px;font-size:12px;color:var(--text-muted);flex-shrink:0}
  .sidebar-meta strong{color:var(--text-secondary);font-weight:600}
  #nav{flex:1;overflow-y:auto;padding:4px 0 12px}
  .nav-item{display:flex;flex-direction:column;padding:9px 20px;text-decoration:none;border-left:3px solid transparent;transition:all .15s;cursor:pointer}
  .nav-item:hover{background:var(--accent-light)}
  .nav-item.active{background:var(--accent-light);border-left-color:var(--accent)}
  .nav-item .cn{color:var(--text);font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav-item .en{color:var(--text-muted);font-size:11px;font-family:var(--mono);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav-item.hidden{display:none}
  .nav-empty{display:none;padding:32px 20px;text-align:center;color:var(--text-muted);font-size:13px}
  .nav-empty.show{display:block}
  .nav-group{margin-bottom:6px}
  .nav-group-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text-muted);padding:12px 20px 6px}
  .nav-schema{display:flex;align-items:center;gap:6px;padding:8px 20px;border-radius:var(--radius-sm);cursor:pointer;color:var(--text-primary);font-size:13px;font-weight:600;transition:all .2s}
  .nav-schema:hover{background:rgba(79,110,247,0.06);color:var(--accent)}
  .nav-schema .schema-arrow{display:inline-block;width:14px;height:14px;line-height:14px;text-align:center;font-size:10px;color:var(--text-muted);transition:transform .2s}
  .nav-schema .schema-arrow.open{transform:rotate(90deg);color:var(--accent)}
  .nav-schema .schema-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav-schema .badge{font-size:11px;color:var(--text-muted);background:#f3f4f6;padding:1px 8px;border-radius:10px;font-family:var(--mono)}
  .nav-schema-body{display:block;overflow:hidden;padding-left:14px}
  .nav-schema-body.hidden{display:none}

  .main{flex:1;min-width:0;padding:32px 40px 60px;overflow-y:auto}
  .hero{border-bottom:1px solid var(--border);padding-bottom:20px;margin-bottom:28px}
  .hero h1{font-size:26px;font-weight:700;letter-spacing:-.4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .hero .tag{display:inline-block;background:rgba(10,194,138,0.1);color:var(--accent-2);font-size:12px;font-weight:600;padding:2px 10px;border-radius:20px;letter-spacing:.2px}
  .hero .meta{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px 20px;font-size:13px;color:var(--text-secondary)}
  .hero .meta span{display:flex;align-items:center;gap:4px}
  .hero .meta .label{color:var(--text-muted);font-size:12px}

  .info-box{padding:14px 18px;margin-bottom:24px;border-radius:var(--radius);background:#f0f4ff;border:1px solid #d6e0ff;font-size:13px;color:var(--text-secondary);line-height:1.6;display:none}
  .info-box.show{display:block}

  .table-block{margin-bottom:16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);overflow:hidden;transition:border-color .2s}
  .table-block:hover{border-color:#d0d6e4}
  .table-block.hidden{display:none}
  .table-header{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;user-select:none;transition:background .15s}
  .table-header:hover{background:var(--accent-light)}
  .table-header .method{font-size:11px;font-weight:700;padding:3px 10px;border-radius:4px;background:rgba(79,110,247,0.08);color:var(--accent);letter-spacing:.3px;flex-shrink:0;font-family:var(--mono)}
  .table-header .path{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--text)}
  .table-header .summary{color:var(--text-secondary);font-size:13px;margin-left:auto;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
  .table-header .chevron{flex-shrink:0;width:20px;height:20px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:14px;transition:transform .2s}
  .table-header .chevron.open{transform:rotate(180deg);color:var(--accent)}
  .table-body{display:none;padding:0 18px 16px}
  .table-body.open{display:block;animation:fadeIn .2s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
  .fields-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
  .fields-table thead th{text-align:left;padding:8px 10px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);border-bottom:1px solid var(--border)}
  .fields-table tbody tr{border-bottom:1px solid #f0f2f6;transition:background .12s}
  .fields-table tbody tr:last-child{border-bottom:none}
  .fields-table tbody tr:hover{background:#f8f9fc}
  .fields-table tbody td{padding:9px 10px;vertical-align:top;line-height:1.4}
  .fields-table .col-name{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--text)}
  .fields-table .col-pk{display:inline-block;background:var(--tag-pk-bg);color:var(--tag-pk-text);font-size:9px;font-weight:700;padding:1px 6px;border-radius:3px;margin-left:6px;letter-spacing:.3px}
  .fields-table .col-required{color:#f43f5e;margin-left:4px;font-size:12px}
  .fields-table .col-type{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:500}
  .fields-table .col-bool{font-size:12px}
  .fields-table .col-bool.true{color:var(--accent-2)}
  .fields-table .col-bool.false{color:var(--text-muted)}
  .fields-table .col-default{font-family:var(--mono);font-size:12px;color:var(--text-muted)}
  .fields-table .col-remark{font-size:12px;color:var(--text-secondary)}
  .fields-table .col-remark.empty{color:var(--text-muted);font-style:italic}
  .rels{border-top:1px solid var(--border);margin-top:12px;padding-top:10px;display:flex;flex-direction:column;gap:6px}
  .rels-group{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
  .rels-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);min-width:44px}
  .rel-tag{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:5px;font-size:12px;background:#f0f4ff;border:1px solid #d6e0ff;color:var(--text-secondary)}
  .rel-arrow{color:var(--accent-2);font-weight:700;font-size:13px}
  .rel-target{font-family:var(--mono);font-size:11px;color:var(--accent)}
  .rel-col{font-family:var(--mono);font-size:11px;color:var(--text)}
  .rel-via{font-size:10px;color:var(--text-muted);margin-left:2px}

  .no-results{text-align:center;padding:60px 20px;display:none}
  .no-results.show{display:block}
  .no-results .icon{font-size:36px;opacity:.2;margin-bottom:8px}
  .no-results h3{font-size:15px;color:var(--text-secondary);margin-bottom:2px}
  .no-results p{font-size:13px;color:var(--text-muted)}

  .footer{text-align:center;padding:24px 0 0;color:var(--text-muted);font-size:12px}

  @media print{
    .sidebar{display:none}
    .main{padding:10px;overflow:visible}
    .table-block{break-inside:avoid}
  }
  @media(max-width:768px){
    body{flex-direction:column}
    .sidebar{width:100%;max-height:45vh;position:static}
    .sidebar-toggle{top:12px;left:12px}
    .main{padding:20px;overflow:visible}
    .hero h1{font-size:20px}
    .table-header{flex-wrap:wrap}
    .table-header .summary{max-width:100%;width:100%;text-align:left;margin-left:0}
  }
</style>
</head>
<body>
<div class="app-layout" id="appLayout">
<aside class="sidebar">
  <div class="sidebar-header">
    <h1>#title#</h1>
    <div class="sidebar-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="搜索表名 / 备注 / 字段..." autocomplete="off">
      <span class="kbd">/</span>
    </div>
  </div>
  <div class="sidebar-meta">
    <span>共 <strong id="totalCount">0</strong> 张表</span>
    <span id="filterInfo"></span>
  </div>
  <div id="nav"></div>
<div class="nav-empty" id="navEmpty">未找到匹配的表或字段</div>
   <div class="sidebar-resize-handle" id="sidebarResizeHandle" title="拖拽调整侧边栏宽度"></div>
 </aside>
<main class="main">
    <div class="hero">
    <h1>#title# <span class="tag">v#version#</span></h1>
    <div class="meta">
      <span><span class="label">数据库</span> #databaseName#</span>
      <span><span class="label">产品</span> #productName# #productVersion#</span>
      <span><span class="label">连接</span> #url#</span>
      <span><span class="label">导出时间</span> #exportTime#</span>
    </div>
  </div>
  <div class="info-box" id="desc"></div>
  <div id="content"></div>
  <div class="no-results" id="noResults">
    <div class="icon">&#9744;</div>
    <h3>无匹配结果</h3>
    <p>尝试修改搜索条件</p>
  </div>
  <div class="footer" style="display:none"></div>
</main>
<script>var data = #dataJson#;</script>
<script>
(function(){
  var esc = function(s) {
    if (s == null) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  };
  var escAttr = function(s) {
    if (s == null) return '';
    return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  };
  var displayName = function(t) {
    var r = (t.remark || t.tableComment || '').trim();
    return r || t.tableName || '';
  };
  var fieldText = function(t) {
    var cols = t.columns || [];
    return cols.map(function(c) { return [c.columnName, c.remark, c.columnComment].filter(Boolean).join(' '); }).join(' ');
  };

var appLayout = document.getElementById('appLayout');
  var sidebar = document.querySelector('.sidebar');

    function getInitialSidebarState(){
      var params = new URLSearchParams(window.location.search);
      var sidebarParam = params.get('sidebar');
      if(sidebarParam !== null){
        return sidebarParam !== 'false' && sidebarParam !== '0';
      }
      try{
        var saved = localStorage.getItem('doc-sidebar-hidden');
        return saved !== 'true';
      }catch(e){
        return true;
      }
    }

    function setSidebarHidden(hidden){
      if(hidden){
        appLayout.classList.add('sidebar-hidden');
        localStorage.setItem('doc-sidebar-hidden', 'true');
      }else{
        appLayout.classList.remove('sidebar-hidden');
        localStorage.setItem('doc-sidebar-hidden', 'false');
      }
    }

    var showSidebar = getInitialSidebarState();
    setSidebarHidden(!showSidebar);

    // === 侧边栏拖拽调整宽度 ===
    var resizeHandle = document.getElementById('sidebarResizeHandle');
    if(resizeHandle){
      var isResizing = false;
      var startX = 0, startWidth = 0;
      resizeHandle.addEventListener('mousedown', function(e){
        isResizing = true;
        startX = e.clientX;
        startWidth = parseInt(getComputedStyle(sidebar).width, 10);
        document.body.style.cursor = 'col-resize';
        resizeHandle.classList.add('active');
        sidebar.style.transition = 'none';
        e.preventDefault();
      });
      document.addEventListener('mousemove', function(e){
        if(!isResizing) return;
        var delta = e.clientX - startX;
        var newWidth = startWidth + delta;
        if(newWidth < 200) newWidth = 200;
        if(newWidth > 600) newWidth = 600;
        sidebar.style.setProperty('--sidebar-w', newWidth + 'px');
      });
      document.addEventListener('mouseup', function(){
        if(isResizing){
          isResizing = false;
          document.body.style.cursor = '';
          resizeHandle.classList.remove('active');
          sidebar.style.transition = 'width .3s';
        }
      });
    }

    if (data.description) {
    var d = document.getElementById('desc');
    d.textContent = data.description;
    d.classList.add('show');
  }

  var nav = document.getElementById('nav');
  var content = document.getElementById('content');
  var tables = data.tables || [];
  document.getElementById('totalCount').textContent = tables.length;

  var groups = {};
  tables.forEach(function(t, i){
    var key = t.schemaName || t.tableSchema || 'default';
    if(!groups[key]) groups[key] = [];
    groups[key].push({t: t, i: i});
  });

  var schemaKeys = Object.keys(groups);
  var singleSchema = schemaKeys.length === 1;

  if(singleSchema){
    nav.innerHTML = groups[schemaKeys[0]].map(function(item){
      var t = item.t;
      var idx = item.i;
      var cn = displayName(t);
      var en = t.tableName || '';
      return '<a class="nav-item" href="#t-' + escAttr(idx) + '" data-index="' + escAttr(idx) + '" data-cn="' + escAttr(cn).toLowerCase() + '" data-en="' + escAttr(en).toLowerCase() + '" data-fields="' + escAttr(fieldText(t)).toLowerCase() + '">' +
        '<span class="cn">' + esc(cn) + '</span>' +
        '<span class="en">' + esc(en) + '</span></a>';
    }).join('');
  } else {
    var navHtml = '';
    schemaKeys.sort().forEach(function(schema){
      var list = groups[schema];
      navHtml += '<div class="nav-group">';
      navHtml += '<div class="nav-schema" onclick="toggleSchema(this)">';
      navHtml += '<span class="schema-arrow">▸</span>';
      navHtml += '<span class="schema-name">' + esc(schema) + '</span>';
      navHtml += '<span class="badge">' + list.length + '</span>';
      navHtml += '</div>';
      navHtml += '</div>';
    });
    nav.innerHTML = navHtml;
  }

  content.innerHTML = tables.map(function(t, i) {
    var cols = t.columns || [];
    var pkField = null;
    if (t.primaryKey) { pkField = t.primaryKey; }
    var rowsHtml = cols.map(function(c, i) {
      var isPk = c.primaryKey || c.columnKey === 'PRI' || (pkField && c.columnName === pkField);
      var notNull = c.nullable === false || c.nullable === 'NO' || c.required;
      var typeStr = c.typeName || c.dataType || c.columnType || '';
      var size = c.columnSize || c.characterMaximumLength;
      var decimal = c.decimalDigits || c.numericScale;
      if (size && decimal != null) { typeStr += '(' + size + ',' + decimal + ')'; }
      else if (size) { typeStr += '(' + size + ')'; }
      var remarkStr = (c.remark || c.columnComment || '').trim();
      return '<tr>' +
        '<td style="color:var(--text-muted);text-align:center">' + (i + 1) + '</td>' +
        '<td><span class="col-name">' + esc(c.columnName) + '</span>' + (isPk ? '<span class="col-pk">PK</span>' : '') + (notNull ? '<span class="col-required">*</span>' : '') + '</td>' +
        '<td><span class="col-type">' + esc(typeStr) + '</span></td>' +
        '<td><span class="col-bool ' + (notNull ? 'true' : 'false') + '">' + (notNull ? 'true' : 'false') + '</span></td>' +
        '<td><span class="col-default">' + esc(c.defaultValue || c.columnDefault || '-') + '</span></td>' +
        '<td class="col-remark ' + (remarkStr ? '' : 'empty') + '">' + (remarkStr || '—') + '</td>' +
        '</tr>';
    }).join('');
    var cn = displayName(t);
    var imported = t.importedKeys || [];
    var exported = t.exportedKeys || [];
    var relHtml = '';
    if(imported.length > 0 || exported.length > 0){
      relHtml += '<div class="rels">';
      if(imported.length > 0){
        relHtml += '<div class="rels-group"><span class="rels-label">引用</span>';
        imported.forEach(function(r){
          relHtml += '<span class="rel-tag"><span class="rel-arrow">→</span><span class="rel-target">' + esc(r.pkTableName) + '.</span><span class="rel-col">' + esc(r.pkColumnName) + '</span><span class="rel-via">via ' + esc(r.fkColumnName) + '</span></span>';
        });
        relHtml += '</div>';
      }
      if(exported.length > 0){
        relHtml += '<div class="rels-group"><span class="rels-label">被引用</span>';
        exported.forEach(function(r){
          relHtml += '<span class="rel-tag"><span class="rel-arrow">←</span><span class="rel-target">' + esc(r.fkTableName) + '.</span><span class="rel-col">' + esc(r.fkColumnName) + '</span></span>';
        });
        relHtml += '</div>';
      }
      relHtml += '</div>';
    }
    return '<div class="table-block" id="t-' + i + '" data-index="' + i + '">' +
      '<div class="table-header" onclick="toggleBlock(this)">' +
      '<span class="method">TABLE</span>' +
      '<span class="path">' + esc(t.tableName) + '</span>' +
      '<span class="summary">' + esc(cn !== t.tableName ? cn : '') + '</span>' +
      '<span class="chevron">&#9660;</span></div>' +
      '<div class="table-body">' +
      '<table class="fields-table">' +
      '<thead><tr><th style="width:30px">#</th><th style="width:22%">字段名</th><th style="width:18%">类型</th><th style="width:8%">必填</th><th style="width:15%">默认值</th><th style="width:37%">说明</th></tr></thead>' +
      '<tbody>' + rowsHtml + '</tbody></table>' + relHtml + '</div></div>';
  }).join('');

  var searchInput = document.getElementById('searchInput');
  var filterInfo = document.getElementById('filterInfo');
  var navEmpty = document.getElementById('navEmpty');
  var noResults = document.getElementById('noResults');

  function toggleSchema(el){
    var arrow = el.querySelector('.schema-arrow');
    var next = el.nextElementSibling;
    var schemaName = el.querySelector('.schema-name').textContent;
    if(next && next.classList.contains('nav-schema-body')){
      next.remove();
      arrow.classList.remove('open');
    } else {
      var list = groups[schemaName] || [];
      var navHtml = '<div class="nav-schema-body">';
      list.forEach(function(item){
        var t = item.t;
        var idx = item.i;
        var cn = displayName(t);
        var en = t.tableName || '';
        navHtml += '<a class="nav-item" href="#t-' + escAttr(idx) + '" data-index="' + escAttr(idx) + '" data-cn="' + escAttr(cn).toLowerCase() + '" data-en="' + escAttr(en).toLowerCase() + '" data-fields="' + escAttr(fieldText(t)).toLowerCase() + '">' +
          '<span class="cn">' + esc(cn) + '</span>' +
          '<span class="en">' + esc(en) + '</span></a>';
      });
      navHtml += '</div>';
      el.insertAdjacentHTML('afterend', navHtml);
      arrow.classList.add('open');
    }
  }

  function applyFilter(q) {
    var query = (q || '').trim().toLowerCase();
    var visible = 0;
    var navItems = Array.from(document.querySelectorAll('.nav-item'));
    navItems.forEach(function(item) {
      var hit = !query ||
        (item.dataset.cn || '').indexOf(query) !== -1 ||
        (item.dataset.en || '').indexOf(query) !== -1 ||
        (item.dataset.fields || '').indexOf(query) !== -1;
      item.classList.toggle('hidden', !hit);
      if (hit) visible++;
      var idx = item.dataset.index;
      var block = document.getElementById('t-' + idx);
      if (block) block.classList.toggle('hidden', !hit);
    });
    navEmpty.classList.toggle('show', visible === 0 && query);
    noResults.classList.toggle('show', visible === 0 && query);
    filterInfo.textContent = query ? ('匹配 ' + visible) : '';
    if(query){
      document.querySelectorAll('.nav-schema-body').forEach(function(body){
        var allHidden = Array.from(body.querySelectorAll('.nav-item')).every(function(item){ return item.classList.contains('hidden'); });
        body.classList.toggle('hidden', allHidden);
      });
    }else{
      document.querySelectorAll('.nav-schema-body').forEach(function(body){
        body.classList.remove('hidden');
      });
    }
  }

  var timer = null;
  searchInput.addEventListener('input', function() {
    clearTimeout(timer);
    timer = setTimeout(function() { applyFilter(searchInput.value); }, 100);
  });

  nav.addEventListener('click', function(e) {
    var item = e.target.closest('.nav-item');
    if (!item) return;
    Array.from(document.querySelectorAll('.nav-item')).forEach(function(n) { n.classList.remove('active'); });
    item.classList.add('active');
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === '/' && document.activeElement !== searchInput) {
      e.preventDefault();
      searchInput.focus();
    }
    if (e.key === 'Escape' && document.activeElement === searchInput) {
      searchInput.value = '';
      applyFilter('');
      searchInput.blur();
    }
  });

  // open first table by default
  var firstBody = document.querySelector('.table-body');
  if (firstBody) {
    firstBody.classList.add('open');
    var firstChevron = document.querySelector('.chevron');
    if (firstChevron) firstChevron.classList.add('open');
  }
  window.toggleSchema = toggleSchema;
})();

function toggleBlock(header) {
  var body = header.nextElementSibling;
  var chevron = header.querySelector('.chevron');
  var open = body.classList.toggle('open');
  if (chevron) chevron.classList.toggle('open', open);
}
</script>
</body>
</html>
