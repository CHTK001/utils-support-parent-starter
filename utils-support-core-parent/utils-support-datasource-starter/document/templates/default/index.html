<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>#title# - #databaseName#</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>:root {
  --bg: #f5f7fa;
  --header-bg: #0560a3;
  --sidebar-bg: #0270c1;
  --bg-card: #ffffff;
  --bg-card-hover: #f5f7fa;
  --bg-input: #ffffff;
  --border: #e4e7ed;
  --border-light: #d1d5db;
  --text-primary: #1f2937;
  --text-secondary: #4b5563;
  --text-muted: #9ca3af;
  --accent: #1677ff;
  --accent-dim: rgba(22, 119, 255, 0.12);
  --accent-glow: rgba(22, 119, 255, 0.25);
  --accent-strong: rgba(22, 119, 255, 0.18);
  --amber: #f59e0b;
  --amber-dim: rgba(245, 158, 11, 0.12);
  --green: #22c55e;
  --green-dim: rgba(34, 197, 94, 0.12);
  --red: #ef4444;
  --radius: 12px;
  --radius-sm: 8px;

  --sidebar-text: #ffffff;
  --sidebar-text-muted: rgba(255, 255, 255, 0.75);
  --sidebar-border: rgba(255, 255, 255, 0.15);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  display: flex; flex-direction: column;
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

.app { flex: 1; display: flex; overflow: hidden; }

/* 头部 */
.header {
  width: 100%; height: 56px; background: var(--header-bg);
  border-bottom: 1px solid var(--sidebar-border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; box-sizing: border-box; flex-shrink: 0;
}
.header-left { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
.header-left .ecology-logo { flex-shrink: 0; }
.header-left .sidebar-btn { flex-shrink: 0; }
.header-left h1 {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.logo {
  width: 40px; height: 40px; border-radius: 10px;
  background: #ffffff;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 800; color: var(--header-bg);
  box-shadow: 0 0 12px rgba(255,255,255,0.25);
  letter-spacing: -1px; flex-shrink: 0;
}
.ecology-logo {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 17px; font-weight: 800; color: #ffffff;
  letter-spacing: 1.5px; text-transform: lowercase;
  opacity: 0.95; text-shadow: 0 1px 2px rgba(0,0,0,0.15);
  user-select: none; flex-shrink: 0;
}
.ecology-logo.small { font-size: 13px; font-weight: 700; letter-spacing: 1px; opacity: 0.85; }
.header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; color: var(--sidebar-text); }
.header h1 span { color: rgba(255,255,255,0.85); }
.header-stats { display: flex; gap: 16px; color: var(--sidebar-text-muted); font-size: 13px; align-items: center; }
.header-stats .stat { display: flex; align-items: center; gap: 6px; }
.header-stats .num { color: var(--sidebar-text); font-weight: 600; font-family: 'JetBrains Mono', monospace; }
.dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.dot-accent { background: #ffffff; box-shadow: 0 0 8px rgba(255,255,255,0.5); }
.dot-amber { background: #fde68a; box-shadow: 0 0 6px rgba(253,230,138,0.4); }
.dot-green { background: #bbf7d0; box-shadow: 0 0 6px rgba(187,247,208,0.4); }

/* 主内容区 */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); }

/* 搜索区域 */
.search-section {
  padding: 16px 20px 12px; border-bottom: 1px solid var(--border);
  background: var(--bg-card); flex-shrink: 0;
}
.search-bar {
  display: flex; gap: 8px; align-items: center;
  background: var(--bg-input); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 5px 6px 5px 16px;
  transition: all 0.25s ease;
}
.search-bar:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
.search-icon { color: var(--accent); font-size: 15px; flex-shrink: 0; }
.search-bar input { flex: 1; background: none; border: none; outline: none; color: var(--text-primary); font-size: 14px; padding: 11px 0; font-family: 'Inter', sans-serif; }
.search-bar input::placeholder { color: var(--text-muted); }
.search-actions { display: flex; gap: 6px; align-items: center; }

.toggle-btn {
  display: flex; align-items: center; gap: 6px; padding: 8px 14px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--bg-card); color: var(--text-secondary); cursor: pointer;
  font-size: 12px; font-weight: 500; transition: all 0.2s; white-space: nowrap;
}
.toggle-btn:hover { border-color: var(--border-light); color: var(--text-primary); }
.toggle-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
.toggle-btn .badge { background: var(--border); padding: 1px 6px; border-radius: 4px; font-size: 10px; font-family: 'JetBrains Mono', monospace; }
  .toggle-btn.active .badge { background: var(--accent-strong); }
  .toggle-btn.hidden{display:none !important}

.result-info {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 4px 10px; color: var(--text-secondary); font-size: 13px; flex-shrink: 0;
}
.result-info .count { color: var(--accent); font-weight: 600; font-family: 'JetBrains Mono', monospace; }

/* 可滚动结果区 */
.scroll-body { flex: 1; overflow-y: auto; padding: 16px 20px 24px; }
.scroll-body .loading { padding: 60px 20px; }

/* 结果列表 */
.results { display: flex; flex-direction: column; gap: 8px; padding-bottom: 12px; }
.result-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px 16px;
  cursor: pointer; transition: all 0.2s ease;
}
.result-card:hover { background: var(--bg-card-hover); border-color: var(--border-light); }
.result-card .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.result-card .result-index { color: var(--text-muted); font-size: 12px; font-weight: 600; font-family: 'JetBrains Mono', monospace; flex-shrink: 0; margin-top: 2px; }
.result-card .name-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0; }
.result-card .table-name { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; color: var(--accent); letter-spacing: -0.2px; flex-shrink: 0; }
.result-card .cn-name { font-size: 14px; font-weight: 500; color: var(--text-primary); }
.result-card .tags { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.tag { font-size: 11px; padding: 2px 10px; border-radius: 20px; font-weight: 500; font-family: 'JetBrains Mono', monospace; }
.tag-db { background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(22, 119, 255, 0.15); }
.tag-mod { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(245, 158, 11, 0.15); }
.tag-owner { background: var(--green-dim); color: var(--green); border: 1px solid rgba(34, 197, 94, 0.15); }
.tag-ms { background: rgba(124, 58, 237, 0.1); color: #7c3aed; border: 1px solid rgba(124, 58, 237, 0.18); font-family: 'JetBrains Mono', monospace; letter-spacing: -0.2px; }
.meta-block {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 6px 18px; margin-bottom: 14px; padding: 10px 12px;
  background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm);
}
.meta-item { display: flex; gap: 8px; font-size: 12px; line-height: 1.6; }
.meta-k { color: var(--text-muted); flex: 0 0 auto; min-width: 92px; }
.meta-v { color: var(--text-secondary); word-break: break-word; }
.tag-field { background: rgba(239, 68, 68, 0.08); color: var(--red); border: 1px solid rgba(239, 68, 68, 0.12); }
.result-card .field-count { font-size: 12px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; flex-shrink: 0; padding-top: 2px; }
.result-card .desc { margin-top: 6px; font-size: 12px; color: var(--text-muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* 字段详情 */
.fields-panel { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 12px; display: none; }
.fields-panel.open { display: block; }
.fields-header { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.fields-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.fields-table th { text-align: left; padding: 6px 10px; color: var(--text-muted); font-weight: 500; border-bottom: 1px solid var(--border); font-family: 'JetBrains Mono', monospace; font-size: 11px; }
.fields-table td { padding: 5px 10px; border-bottom: 1px solid var(--border); color: var(--text-secondary); }
.fields-table tr:hover td { background: var(--bg-card-hover); }
.fields-table .field-name { font-family: 'JetBrains Mono', monospace; color: var(--text-primary); font-weight: 500; }
.fields-table .field-cn { color: var(--text-primary); }
.fields-table .field-type { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--amber); }
.fields-table .field-len { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
.pk-badge { display: inline-block; background: var(--amber-dim); color: var(--amber); padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 600; font-family: 'JetBrains Mono', monospace; }

/* 分页 */
.pagination { display: flex; justify-content: center; align-items: center; gap: 8px; padding: 16px 0 10px; position: sticky; bottom: 0; background: var(--bg); z-index: 5; }
.page-btn { padding: 6px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-card); color: var(--text-secondary); cursor: pointer; font-size: 13px; transition: all 0.2s; }
.page-btn:hover { border-color: var(--accent); color: var(--accent); }
.page-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
.page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.page-total {
  padding: 6px 10px; color: var(--text-muted); font-size: 13px;
  white-space: nowrap; user-select: none;
}

/* 加载状态 */
.loading { text-align: center; padding: 80px 20px; color: var(--text-muted); }
.spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }

.empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.empty-state .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
.empty-state h3 { font-size: 18px; color: var(--text-secondary); margin-bottom: 8px; }

/* 高亮 */
.highlight { color: var(--accent); background: var(--accent-dim); padding: 0 2px; border-radius: 2px; }
.highlight-field { color: var(--red); background: rgba(239, 68, 68, 0.08); padding: 0 2px; border-radius: 2px; }

/* 左侧模块导航 */
.sidebar {
  width: 240px; flex-shrink: 0; background: var(--sidebar-bg);
  border-right: 1px solid var(--sidebar-border);
  display: flex; flex-direction: column; overflow: hidden;
  transition: width .3s;
}
  .app.sidebar-hidden .sidebar {
    width: 0 !important;
    border-right: none;
    overflow: hidden;
  }
.app.sidebar-hidden .main {
  flex-grow: 1;
}
.sidebar-header {
  position: relative;
  padding: 12px 16px;
  border-bottom: 1px solid var(--sidebar-border);
}
.sidebar-header .sidebar-btn {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  cursor: pointer;
  color: var(--text-secondary);
  transition: all .2s;
}
.sidebar-header .sidebar-btn:hover {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.sidebar-resize-handle {
  position: absolute;
  top: 0;
  right: -4px;
  width: 8px;
  height: 100%;
  cursor: col-resize;
  z-index: 10;
  opacity: 0;
  background: transparent;
  transition: opacity .2s;
}
.sidebar-resize-handle:hover,
.sidebar-resize-handle.active {
  opacity: 1;
  background: rgba(99,102,241,0.15);
}
.sidebar:hover .sidebar-resize-handle {
  opacity: .4;
}
.app.sidebar-hidden .sidebar-header .sidebar-btn {
  position: fixed;
  top: 16px;
  right: 16px;
  z-index: 100;
}
.nav-tabs { display: flex; border-bottom: 1px solid var(--sidebar-border); margin: 0 12px; flex-shrink: 0; }
.nav-tab {
  flex: 1; padding: 12px 8px; text-align: center; font-size: 14px; font-weight: 500;
  color: var(--sidebar-text-muted); cursor: pointer; border-bottom: 2px solid transparent;
  margin-bottom: -1px; transition: all .2s;
}
.nav-tab:hover { color: var(--sidebar-text); }
.nav-tab.active { color: var(--sidebar-text); border-bottom-color: var(--sidebar-text); }
.nav-list { flex: 1; overflow-y: auto; padding: 8px 12px 12px; scrollbar-width: none; -ms-overflow-style: none; }
.nav-list::-webkit-scrollbar { display: none; }
.nav-list.hidden { display: none; }
.sidebar-header h2 { font-size: 14px; font-weight: 600; color: var(--sidebar-text); display: flex; align-items: center; gap: 8px; }
.sidebar-header .count { color: var(--sidebar-text-muted); font-weight: 500; font-size: 12px; font-family: 'JetBrains Mono', monospace; }
.module-search {
  padding: 10px 14px 0; display: flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,.12); border: none; margin: 10px 14px 0; border-radius: var(--radius-sm);
}
.module-search input { flex: 1; background: none; border: none; outline: none; color: var(--sidebar-text); font-size: 13px; padding: 8px 0; font-family: 'Inter', sans-serif; }
.module-search input::placeholder { color: rgba(255,255,255,.55); }

.nav-item {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 8px 10px; border-radius: 6px; cursor: pointer; color: var(--sidebar-text-muted);
  font-size: 13px; transition: all .15s; margin-bottom: 2px;
}
.nav-item:hover { background: rgba(255,255,255,.08); color: var(--sidebar-text); }
.nav-item.active { background: rgba(255,255,255,.15); color: var(--sidebar-text); }
.nav-item .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-item .badge { flex-shrink: 0; background: rgba(255,255,255,.15); color: rgba(255,255,255,.8); font-size: 11px; padding: 2px 7px; border-radius: 10px; font-weight: 500; }
.nav-item.active .badge { background: rgba(255,255,255,.25); color: #ffffff; }
.nav-item.empty { display: none; }

/* 侧边栏切换按钮（嵌入 header，不固定定位，避免遮挡文本） */
.sidebar-btn {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  cursor: pointer;
  color: var(--text-secondary);
  transition: all .2s;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  box-shadow: 0 2px 8px rgba(15,23,42,0.08);
  flex-shrink: 0;
  margin-right: 8px;
}
.sidebar-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.sidebar-btn.hidden { display: none !important; }

@media (max-width: 1024px) {
  .app { flex-direction: column; height: auto; overflow: visible; padding: 0 16px; }
  .sidebar { width: 100%; height: auto; position: static; border: 1px solid var(--sidebar-border); border-radius: var(--radius); margin-left: 0; margin-top: 12px; background: var(--sidebar-bg); }
  .main { height: auto; overflow: visible; padding: 0 0 20px; }
  .scroll-body { overflow-y: visible; padding-right: 0; }
}

@media (max-width: 768px) {
  .app { padding: 0; }
  .header { padding: 14px 16px; }
  .header h1 { font-size: 16px; }
  .header-stats { gap: 14px; font-size: 12px; }
  .main { padding: 0 16px 20px; }
  .search-section { margin-top: 16px; }
  .search-bar { padding: 4px 4px 4px 12px; }
  .search-actions { flex-wrap: wrap; }
  .result-card .top { flex-direction: column; }
  .result-card .name-group { flex-wrap: wrap; }
  .sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 280px; z-index: 90; border-radius: 0; border-right: 1px solid var(--sidebar-border); transform: translateX(-100%); transition: transform 0.25s ease; margin-left: 0; margin-top: 0; height: 100vh; }
  .sidebar.open { transform: translateX(0); }
  .sidebar-btn { display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .result-info { padding: 12px 0 8px; }
}</style>
</head>
<body>
<header class="header">
    <div class="header-left">
      <span class="ecology-logo">ecology</span>
      <h1>#title#</h1>
    </div>
    <div class="header-stats">
      <span class="stat"><span class="dot dot-accent"></span> 表 <span class="num" id="totalTables">-</span></span>
      <span class="stat" style="color:rgba(255,255,255,0.7);font-size:12px">#exportTime#</span>
    </div>
  </header>
<div class="app" id="app">
  
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="nav-tabs">
      <div class="nav-tab active" data-tab="module">模块</div>
      <div class="nav-tab" data-tab="db">数据库</div>
    </div>
    <div class="module-search">
      <span style="color:var(--text-muted);font-size:13px">🔍</span>
      <input type="text" id="moduleSearchInput" placeholder="搜索模块...">
    </div>
    <div class="nav-list" id="moduleList"></div>
    <div class="nav-list hidden" id="dbList"></div>
    <div class="sidebar-resize-handle" id="sidebarResizeHandle" title="拖拽调整侧边栏宽度"></div>
  </aside>
  <div class="main">

  <!-- 头部 -->
  

  <!-- 搜索 -->
  <div class="search-section">
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="输入表名、中文名或字段名搜索..." autofocus>
      <div class="search-actions">
        <button class="toggle-btn" id="fieldToggle">
          🔎 字段搜索 <span class="badge" id="fieldToggleBadge">OFF</span>
        </button>
      </div>
    </div>
    <input type="hidden" id="dbFilter" value="">
    <input type="hidden" id="modFilter" value="">
  </div>

  <!-- 结果信息 -->
  <div class="scroll-body">
  <div class="result-info" id="resultInfo" style="display:none">
    <span>共 <span class="count" id="resultCount">0</span> 条结果</span>
    <span id="resultTime" style="font-size:12px"></span>
  </div>

  <!-- 加载 -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div>正在加载数据字典...</div>
  </div>

  <!-- 结果 -->
  <div class="results" id="results"></div>

  <!-- 分页 -->
  <div class="pagination" id="pagination"></div>
  </div>
  </div>
</div>

<script>var data = #dataJson#;</script>
<script>
// ====================== 导航状态持久化 ======================
function saveNavState(tab, mod, db) {
  try {
    if (tab) localStorage.setItem('doc-nav-tab', tab);
    if (mod !== undefined) localStorage.setItem('doc-nav-mod', mod);
    if (db !== undefined) localStorage.setItem('doc-nav-db', db);
  } catch (e) {}
}
function loadNavState() {
  try {
    return {
      tab: localStorage.getItem('doc-nav-tab') || 'module',
      mod: localStorage.getItem('doc-nav-mod') || '',
      db: localStorage.getItem('doc-nav-db') || ''
    };
  } catch (e) {
    return { tab: 'module', mod: '', db: '' };
  }
}

// ====================== 数据加载 ======================
const PER_PAGE = 50;
let currentPage = 1;
let filteredTables = [];
let fieldSearchActive = false;
let fieldSearchMode = false;
let searchTimeout = null;

function loadData() {
  try {
    document.getElementById('totalTables').textContent = data.total.toLocaleString();

    // 导航菜单按拼音首字母排序
    const collator = new Intl.Collator('zh-CN', { sensitivity: 'base' });
    if (data.mo) data.mo.sort((a, b) => collator.compare(a.n, b.n));
    if (data.db) data.db.sort((a, b) => collator.compare(a.n, b.n));

    // 筛选状态通过左侧导航维护

    // 恢复上次导航状态
    const saved = loadNavState();
    const validMod = (data.mo || []).some(m => m.n === saved.mod) ? saved.mod : '';
    const validDb = (data.db || []).some(d => d.n === saved.db) ? saved.db : '';
    document.getElementById('modFilter').value = validMod;
    document.getElementById('dbFilter').value = validDb;
    if (saved.tab === 'db') {
      switchNavTab('db');
    } else {
      switchNavTab('module');
    }

    document.getElementById('loading').style.display = 'none';
    filteredTables = data.ts;
    window.__initialRender = true;
    renderResults();
    window.__initialRender = false;
    renderModuleList();
    renderDbList();
    // 重置滚动位置
    requestAnimationFrame(() => {
      const sb = document.querySelector('.scroll-body');
      if (sb) sb.scrollTop = 0;
      window.scrollTo(0, 0);
    });
  } catch(e) {
    document.getElementById('loading').innerHTML =
      `<div class="empty-state"><div class="icon">⚠️</div><h3>加载失败</h3><p>${e.message}</p></div>`;
  }
}

// ====================== 搜索逻辑 ======================
function doSearch() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const db = document.getElementById('dbFilter').value;
  const mod = document.getElementById('modFilter').value;
  const fieldMode = fieldSearchMode;

  let results = data.ts;

  // 数据库筛选
  if (db) results = results.filter(t => t.d === db);
  // 模块筛选
  if (mod) results = results.filter(t => t.m === mod);

  if (q) {
    if (fieldMode) {
      // 字段搜索模式：匹配字段名或字段中文名
      results = results.filter(t => {
        if (!t.f || t.f.length === 0) return false;
        // 也匹配表名和中文名
        if (t.t.toLowerCase().includes(q) || t.c.toLowerCase().includes(q)) return true;
        return t.f.some(f =>
          f.n.toLowerCase().includes(q) || f.c.toLowerCase().includes(q)
        );
      });
    } else {
      // 表名搜索模式
      results = results.filter(t =>
        t.t.toLowerCase().includes(q) || t.c.toLowerCase().includes(q)
      );
    }
  }

  filteredTables = results;
  currentPage = 1;
  renderResults();
}

// 防抖
function onSearchInput() {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(doSearch, 150);
}

// ====================== 渲染 ======================
function renderResults() {
  const container = document.getElementById('results');
  const info = document.getElementById('resultInfo');
  const count = document.getElementById('resultCount');
  const time = document.getElementById('resultTime');

  const total = filteredTables.length;
  if (total === 0) {
    info.style.display = 'none';
    container.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><h3>未找到匹配结果</h3><p>试试其他关键词</p></div>`;
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  const isInitial = window.__initialRender !== false;
  if (!isInitial) {
    info.style.display = 'flex';
    count.textContent = total.toLocaleString();
    time.textContent = `${data.total} 张表中检索`;
  } else {
    info.style.display = 'none';
  }

  const start = (currentPage - 1) * PER_PAGE;
  const end = Math.min(start + PER_PAGE, total);
  const pageItems = filteredTables.slice(start, end);

  const q = document.getElementById('searchInput').value.trim().toLowerCase();

  container.innerHTML = pageItems.map(t => {
    const nameHtml = q ? highlightText(escapeHtml(t.t), q) : escapeHtml(t.t);
    const cnHtml = q ? highlightText(escapeHtml(t.c), q) : escapeHtml(t.c);
    const fieldCount = t.f ? t.f.length : 0;

    // 检查字段匹配
    let fieldMatchHtml = '';
    if (fieldSearchMode && q && t.f) {
      const matchedFields = t.f.filter(f =>
        f.n.toLowerCase().includes(q) || f.c.toLowerCase().includes(q)
      );
      if (matchedFields.length > 0) {
        fieldMatchHtml = `<div style="margin-top:6px;font-size:11px;color:var(--red)">` +
          `🔎 匹配字段: ${matchedFields.map(f =>
            `<span class="tag tag-field">${escapeHtml(f.n)}${f.c ? ' ('+escapeHtml(f.c)+')' : ''}</span>`
          ).join(' ')}</div>`;
      }
    }

    return `<div class="result-card" data-index="${start + pageItems.indexOf(t)}" onclick="toggleFields(this)">
      <div class="top">
        <span class="result-index">${start + pageItems.indexOf(t) + 1}</span>
        <div class="name-group">
          <span class="table-name">${nameHtml}</span>
          <span class="cn-name">${cnHtml}</span>
          <div class="tags">
            ${t.d ? `<span class="tag tag-db">${escapeHtml(t.d)}</span>` : ''}
            ${t.m ? `<span class="tag tag-mod">${escapeHtml(t.m)}</span>` : ''}
            ${t.o ? `<span class="tag tag-owner">${escapeHtml(t.o)}</span>` : ''}
            ${t.ms ? `<span class="tag tag-ms">\u{1F517} ${escapeHtml(t.ms)}</span>` : ''}
          </div>
        </div>
        <span class="field-count">${fieldCount} 字段</span>
      </div>
      ${t.ds ? `<div class="desc">${escapeHtml(t.ds)}</div>` : ''}
      ${fieldMatchHtml}
      <div class="fields-panel"><div class="fields-header">📋 字段列表</div><div class="fields-loading" style="color:var(--text-muted);font-size:12px;padding:8px;">点击展开...</div></div>
    </div>`;
  }).join('');

  renderPagination(total);
  document.getElementById('pagination').scrollIntoView({ behavior: 'smooth', block: 'end' });
}

function renderPagination(total) {
  const pages = Math.ceil(total / PER_PAGE);
  const el = document.getElementById('pagination');
  if (pages <= 1) { el.innerHTML = ''; return; }

  let html = `<span class="page-total">共 ${pages} 页</span>`;
  html += `<button class="page-btn" onclick="goPage(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''}>← 上一页</button>`;

  const startPage = Math.max(1, currentPage - 2);
  const endPage = Math.min(pages, currentPage + 2);
  for (let i = startPage; i <= endPage; i++) {
    html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
  }
  html += `<button class="page-btn" onclick="goPage(${currentPage + 1})" ${currentPage >= pages ? 'disabled' : ''}>下一页 →</button>`;
  el.innerHTML = html;
}

function goPage(p) {
  currentPage = p;
  renderResults();
}

// ====================== 字段详情 ======================
function toggleFields(el) {
  const panel = el.querySelector('.fields-panel');
  const isOpen = panel.classList.contains('open');
  panel.classList.toggle('open');
  if (isOpen) return;

  const gi = parseInt(el.getAttribute('data-index'));
  const t = filteredTables[gi] || {};
  const fields = t.f || [];

  // 表元数据块（来自官方数据字典的表级信息）
  const metaRows = [];
  if (t.ms) metaRows.push(['微服务', escapeHtml(t.ms)]);
  if (t.o)  metaRows.push(['负责人', escapeHtml(t.o)]);
  if (t.cl) metaRows.push(['数据是否可清理', escapeHtml(t.cl)]);
  if (t.ac) metaRows.push(['是否有自动清理机制', escapeHtml(t.ac)]);
  if (t.ci) metaRows.push(['数据清理影响说明', escapeHtml(t.ci)]);
  if (t.cm) metaRows.push(['自动清理机制说明', escapeHtml(t.cm)]);
  let metaHtml = '';
  if (metaRows.length > 0) {
    metaHtml = `<div class="meta-block">` +
      metaRows.map(r => `<div class="meta-item"><span class="meta-k">${r[0]}</span><span class="meta-v">${r[1]}</span></div>`).join('') +
      `</div>`;
  }

  let fieldsHtml = '';
  if (fields.length > 0) {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    fieldsHtml = `<div class="fields-header">\u{1F4CB} 字段列表 (${fields.length})</div>
    <table class="fields-table">
      <thead><tr>
        <th style="width:30px">#</th>
        <th style="width:160px">列名</th>
        <th style="width:120px">中文名</th>
        <th style="width:80px">类型</th>
        <th style="width:50px">长度</th>
        <th style="width:40px">PK</th>
      </tr></thead>
      <tbody>
        ${fields.map((f, i) => {
          const nH = fieldSearchMode && q ? highlightText(escapeHtml(f.n), q) : escapeHtml(f.n);
          const cH = fieldSearchMode && q ? highlightText(escapeHtml(f.c), q) : escapeHtml(f.c);
          return `<tr>
            <td style="color:var(--text-muted)">${i + 1}</td>
            <td class="field-name">${nH}</td>
            <td class="field-cn">${cH}</td>
            <td><span class="field-type">${escapeHtml(f.tp || '')}</span></td>
            <td class="field-len">${f.ln || ''}</td>
            <td>${f.pk ? '<span class="pk-badge">PK</span>' : ''}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
  } else {
    fieldsHtml = `<div class="fields-header">\u{1F4CB} 字段列表</div><div style="color:var(--text-muted);font-size:12px;padding:6px 2px;">该表暂无字段明细数据</div>`;
  }

  panel.innerHTML = metaHtml + fieldsHtml;
}

// ====================== 工具函数 ======================
function escapeHtml(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function highlightText(text, query) {
  if (!query) return text;
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if (idx === -1) return text;
  return text.slice(0, idx) + '<span class="highlight">' + text.slice(idx, idx + query.length) + '</span>' + text.slice(idx + query.length);
}

// ====================== 事件绑定 ======================
document.getElementById('searchInput').addEventListener('input', onSearchInput);
// 筛选事件由左侧导航触发

document.getElementById('fieldToggle').addEventListener('click', function() {
  fieldSearchMode = !fieldSearchMode;
  this.classList.toggle('active');
  document.getElementById('fieldToggleBadge').textContent = fieldSearchMode ? 'ON' : 'OFF';
  if (fieldSearchMode) {
    this.innerHTML = '🔎 字段搜索 <span class="badge" id="fieldToggleBadge">ON</span>';
  } else {
    this.innerHTML = '🔎 字段搜索 <span class="badge" id="fieldToggleBadge">OFF</span>';
  }
  doSearch();
});

// 键盘快捷键
document.addEventListener('keydown', function(e) {
  if (e.key === '/' && !e.ctrlKey && !e.metaKey && document.activeElement !== document.getElementById('searchInput')) {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
});

// ====================== 启动 ======================

// ====================== 模块侧边栏 ======================
let currentNavTab = 'module';

function renderModuleList() {
  const list = document.getElementById('moduleList');
  const current = document.getElementById('modFilter').value;
  const items = [
    { n: '', c: data.total, label: '全部模块' },
    ...data.mo.map(m => ({ n: m.n, c: m.c, label: m.n }))
  ];
  list.innerHTML = items.map((m, i) => {
    const active = m.n === current ? 'active' : '';
    return '<div class="nav-item ' + active + '" data-module="' + escapeHtml(m.n) + '">' +
      '<span class="name" title="' + escapeHtml(m.label) + '">' + (i + 1) + '. ' + escapeHtml(m.label) + '</span>' +
      '<span class="badge">' + m.c + '</span></div>';
  }).join('');
  document.querySelectorAll('#moduleList .nav-item').forEach(el => {
    el.addEventListener('click', () => {
      document.getElementById('modFilter').value = el.dataset.module;
      saveNavState(currentNavTab, el.dataset.module, document.getElementById('dbFilter').value);
      doSearch();
      if (window.innerWidth <= 768) closeSidebar();
    });
  });
}

function renderDbList() {
  const list = document.getElementById('dbList');
  const current = document.getElementById('dbFilter').value;
  const items = [
    { n: '', c: data.total, label: '全部数据库' },
    ...data.db.map(d => ({ n: d.n, c: d.c, label: d.n }))
  ];
  list.innerHTML = items.map((d, i) => {
    const active = d.n === current ? 'active' : '';
    return '<div class="nav-item ' + active + '" data-db="' + escapeHtml(d.n) + '">' +
      '<span class="name" title="' + escapeHtml(d.label) + '">' + (i + 1) + '. ' + escapeHtml(d.label) + '</span>' +
      '<span class="badge">' + d.c + '</span></div>';
  }).join('');
  document.querySelectorAll('#dbList .nav-item').forEach(el => {
    el.addEventListener('click', () => {
      document.getElementById('dbFilter').value = el.dataset.db;
      saveNavState(currentNavTab, document.getElementById('modFilter').value, el.dataset.db);
      doSearch();
      if (window.innerWidth <= 768) closeSidebar();
    });
  });
}

function switchNavTab(tab) {
  currentNavTab = tab;
  document.querySelectorAll('.nav-tab').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === tab);
  });
  document.getElementById('moduleList').classList.toggle('hidden', tab !== 'module');
  document.getElementById('dbList').classList.toggle('hidden', tab !== 'db');
  const input = document.getElementById('moduleSearchInput');
  input.placeholder = tab === 'module' ? '搜索模块...' : '搜索数据库...';
  input.value = '';
  filterNavList('');
}

function updateNavActive() {
  const currentMod = document.getElementById('modFilter').value;
  document.querySelectorAll('#moduleList .nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.module === currentMod);
  });
  const currentDb = document.getElementById('dbFilter').value;
  document.querySelectorAll('#dbList .nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.db === currentDb);
  });
}

function filterNavList(q) {
  q = q.trim().toLowerCase();
  const container = currentNavTab === 'module' ? document.getElementById('moduleList') : document.getElementById('dbList');
  container.querySelectorAll('.nav-item').forEach(el => {
    const name = el.querySelector('.name').textContent.toLowerCase();
    el.classList.toggle('empty', q && !name.includes(q));
  });
}

function openSidebar() { document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebarBackdrop').classList.add('open'); }
function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarBackdrop').classList.remove('open'); }

// 侧边栏显示/隐藏逻辑（URL参数 > localStorage）
var appEl = document.getElementById('app');
var sidebar = document.getElementById('sidebar');

function getInitialSidebarState(){
  var params = new URLSearchParams(window.location.search);
  var sidebarParam = params.get('sidebar');
  if(sidebarParam !== null){
    return sidebarParam !== 'false' && sidebarParam !== '0';
  }
  try{
    var saved = localStorage.getItem('doc-sidebar-hidden');
    return saved !== 'true';
  }catch(e){
    return true;
  }
}

function setSidebarHidden(hidden){
  if(hidden){
    appEl.classList.add('sidebar-hidden');
    try{ localStorage.setItem('doc-sidebar-hidden', 'true'); }catch(e){}
  }else{
    appEl.classList.remove('sidebar-hidden');
    try{ localStorage.setItem('doc-sidebar-hidden', 'false'); }catch(e){}
  }
}

// 桌面端：侧边栏默认隐藏
// 移动端：侧边栏默认隐藏，无切换按钮
var isMobile = window.innerWidth <= 1024;
if(isMobile){
  // 移动端默认隐藏 sidebar，在 .sidebar CSS 中 transform: translateX(-100%) 控制
} else {
  var showSidebar = getInitialSidebarState();
  setSidebarHidden(!showSidebar);
}

  // === 侧边栏拖拽调整宽度 ===
  var resizeHandle = document.getElementById('sidebarResizeHandle');
  if(resizeHandle){
    var isResizing = false;
    var startX = 0, startWidth = 0;
    resizeHandle.addEventListener('mousedown', function(e){
      isResizing = true;
      startX = e.clientX;
      startWidth = parseInt(getComputedStyle(sidebar).width, 10);
      document.body.style.cursor = 'col-resize';
      resizeHandle.classList.add('active');
      sidebar.style.transition = 'none';
      e.preventDefault();
    });
    document.addEventListener('mousemove', function(e){
      if(!isResizing) return;
      var delta = e.clientX - startX;
      var newWidth = startWidth + delta;
      if(newWidth < 200) newWidth = 200;
      if(newWidth > 600) newWidth = 600;
      sidebar.style.width = newWidth + 'px';
    });
    document.addEventListener('mouseup', function(){
      if(isResizing){
        isResizing = false;
        document.body.style.cursor = '';
        resizeHandle.classList.remove('active');
        sidebar.style.transition = 'width .3s';
      }
    });
  }

  document.getElementById('sidebarBackdrop').addEventListener('click', closeSidebar);
document.getElementById('moduleSearchInput').addEventListener('input', function() { filterNavList(this.value); });
